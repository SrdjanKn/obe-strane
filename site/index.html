<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obe strane — ista vest, dve strane</title>
<meta name="description" content="Kako mediji u Srbiji izveštavaju o istim događajima: provladini i kritički naslovi, uporedo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Noto+Serif:ital,wght@0,500;0,600;0,700;1,600&family=Inter:wght@400;500;600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --pg:#b4472f; --cr:#24478f; --pub:#7d6aa8; --mix:#aaa59d; --intl:#3f7f86;
  --ink:#121212; --ink2:#454549; --ink3:#5f5f66; --rule:#dcdcdc; --soft:#f6f6f4;
  --amber:#a14a07; --amber-bg:#fbf3ea; --amber-on-dark:#f0a35e;
  --head:"Noto Serif", Georgia, serif;
  --brand:"DM Serif Display", Georgia, serif;
  --serif:"Source Sans 3", "Source Sans Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --sans:Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --w:1280px;
}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font:400 17px/1.55 var(--serif);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:hover .hl,a.hl:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
button,input{font:inherit}
img{display:block;max-width:100%}
.wrap{max-width:var(--w);margin:0 auto;padding:0 32px}
.col{max-width:760px;margin:0 auto;padding:0 24px}
.wide{max-width:1080px;margin:0 auto;padding:0 24px}
.sans{font-family:var(--sans)}
.hl{font-family:var(--head);font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.meta{font:500 13px/1.4 var(--sans);color:var(--ink3)}
.kicker{font:700 11.5px/1.2 var(--sans);letter-spacing:.09em;text-transform:uppercase;margin-bottom:8px}
.kicker.amber{color:var(--amber)}
.eye{width:13px;height:13px;vertical-align:-2px;margin-right:5px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.util{border-bottom:1px solid var(--rule)}
.util .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 20px;padding-top:10px;padding-bottom:10px;font:500 13px var(--sans);color:var(--ink2)}
.util form{display:flex;align-items:center;gap:8px}
.util input{height:36px;width:220px;padding:0 12px;border:1px solid var(--rule);font:400 14px var(--sans)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:0 14px;border:1px solid var(--ink);background:#fff;color:var(--ink);font:600 13px var(--sans);cursor:pointer}
.btn.dark{background:var(--ink);color:#fff}
.mast{text-align:center;padding:28px 0 16px}
.mast a{display:inline-flex;align-items:center;gap:18px}
.mast .name{font:400 clamp(44px,7vw,80px)/1 var(--brand);letter-spacing:-.02em}
.mast .tag{font:italic 400 19px/1.3 var(--serif);color:var(--ink2);margin-top:10px}
.mark{display:inline-flex;border-radius:50%;overflow:hidden;transform:rotate(-35deg);flex:none}
.mark i{flex:1;background:var(--pg)} .mark i:last-child{background:var(--cr)} .mark b{background:#fff}
nav.sections{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 26px;padding:12px 0;border-top:1px solid var(--rule);border-bottom:3px solid var(--ink);font:600 14.5px var(--sans)}
nav.sections a{padding:6px 0;border-bottom:2px solid transparent}
nav.sections a.on{border-bottom-color:var(--ink)}
nav.sections a.amber{color:var(--amber)}
nav.sections .sep{width:1px;background:var(--rule);margin:4px 0}
.focus{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 22px;padding:12px 0 0;font:400 14px var(--sans);color:var(--ink2)}
.focus b{color:var(--ink)}
.compact-head{border-bottom:3px solid var(--ink)}
.compact-head .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;padding-top:14px;padding-bottom:12px}
.compact-head .logo{display:inline-flex;align-items:center;gap:10px;font:400 30px/1 var(--brand)}
.compact-head nav{display:flex;flex-wrap:wrap;gap:4px 22px;font:600 14px var(--sans)}
.bar{display:flex;gap:2px;height:6px;background:#ececec;overflow:hidden}
.bar i{display:block;height:100%}
.cov{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;margin-top:7px;font:500 12.5px/1.3 var(--sans);color:var(--ink3)}
.cov .pg{color:var(--pg)} .cov .cr{color:var(--cr)}
.c-pg{color:var(--pg)} .c-cr{color:var(--cr)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:0}
.ph{position:relative;width:100%;aspect-ratio:3/2;overflow:hidden;background:#8a8f96}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.25))}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph span{position:absolute;left:14px;bottom:12px;z-index:1;font:600 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:#fff}
.ph.has-img span{display:none}
.lead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.9fr) minmax(0,1fr);grid-template-rows:auto auto 1fr;
  grid-template-areas:"text photo rail" "text quotes rail" "side more rail";gap:24px 28px;padding-top:28px}
.lead-text{grid-area:text;min-width:0}
.lead-photo{grid-area:photo;min-width:0}
.lead-quotes{grid-area:quotes;min-width:0}
.lead-side{grid-area:side;min-width:0}
.lead-more{grid-area:more;min-width:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px;align-content:start}
.rail{grid-area:rail;min-width:0;border-left:1px solid var(--rule);padding-left:24px}
.quotes2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}
.lead h1{margin:0 0 12px;font:700 34px/1.14 var(--head);letter-spacing:-.01em}
.dek{margin:0 0 18px;font:400 17px/1.5 var(--serif);color:var(--ink2)}
.quote{font:600 17px/1.3 var(--head)}
.q-pg{display:block;border-left:3px solid var(--pg);padding-left:12px}
.q-cr{display:block;border-left:3px solid var(--cr);padding-left:12px}
.rail-item{display:block;padding:14px 0;border-top:1px solid var(--rule)}
.rail-item .hl{font-size:17px;line-height:1.3;font-weight:600;margin-bottom:9px}
.rail-item .lab{font:700 11px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;margin-bottom:7px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-top:3px solid var(--ink);padding-top:10px;margin:44px 0 18px}
.sec-head h2{margin:0;font:700 28px/1.15 var(--head)}
.sec-head a{font:600 13px var(--sans)}
.strip{display:flex;flex-wrap:wrap;gap:28px 24px}
.strip>a{flex:1 1 230px;min-width:0}
.strip .hl{font-size:19px;line-height:1.28;margin:0 0 10px}
.band{background:var(--ink);color:#fff;margin-top:44px}
.band .wrap{padding-top:48px;padding-bottom:52px;display:flex;flex-wrap:wrap;gap:40px}
.band h2{margin:0 0 16px;font:700 clamp(26px,3.4vw,38px)/1.15 var(--head);color:#fff}
.band p{margin:0 0 26px;font:400 18px/1.55 var(--serif);color:#d0d0d4}
.band .num{font:700 52px/1 var(--head)}
.band .num-rule{height:3px;margin:10px 0 6px}
.band .item{display:block;padding:14px 0;border-top:1px solid #333338;color:#fff}
.band .item .src{font:600 12.5px var(--sans);color:#b8b8bd;margin-bottom:4px}
.band .item .t{font:600 19px/1.28 var(--head)}
.two{display:flex;flex-wrap:wrap;gap:40px}
.two>section{flex:1 1 400px;min-width:0}
.sec-lead{display:flex;flex-wrap:wrap;gap:18px;padding-bottom:6px}
.sec-lead>div{flex:1 1 200px;min-width:0}
.sec-lead .hl{font-size:21px;line-height:1.24;margin-bottom:10px}
.li{display:block;padding:14px 0;border-top:1px solid var(--rule)}
.li .hl{font-size:18px;line-height:1.3;font-weight:600;margin-bottom:9px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 32px}
.news{margin-top:52px;background:var(--amber-bg);border-top:3px solid var(--amber);padding:32px;display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between}
.news h2{margin:0 0 6px;font:700 30px/1.15 var(--head)}
.news form{flex:1 1 360px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.news label{flex:1 1 220px;display:flex;flex-direction:column;gap:6px;font:600 13px var(--sans)}
.news input{height:46px;padding:0 14px;border:1px solid var(--ink);background:#fff;font:400 15px var(--sans)}
.news button{height:48px;padding:0 22px;background:var(--ink);color:#fff;border:0;font:600 15px var(--sans);cursor:pointer}
.subnav{border-bottom:1px solid var(--rule)}
.subnav .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 22px;padding-top:11px;padding-bottom:11px;font:500 14px var(--sans);color:var(--ink2)}
.subnav button{background:none;border:0;padding:0;color:inherit;cursor:pointer;font:500 14px var(--sans)}
.story h1{margin:0 0 16px;font:700 clamp(30px,4.4vw,46px)/1.12 var(--head);letter-spacing:-.01em}
.story .dek{font-size:21px}
.byline{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--rule);border-radius:999px;background:#fff;font:600 14px var(--sans);color:var(--ink);cursor:pointer}
.covbox{background:var(--soft);padding:24px;border-top:3px solid var(--ink);display:flex;flex-wrap:wrap;gap:24px}
.covbox>div{flex:1 1 240px;min-width:0}
.covbox .sent{font:400 19px/1.45 var(--serif);margin-bottom:16px}
.covbox .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--rule);font:500 14.5px var(--sans)}
.h2{margin:0 0 6px;font:700 32px/1.15 var(--head)}
.sides{display:flex;flex-wrap:wrap;gap:28px}
.side{flex:1 1 300px;min-width:0;border-top:3px solid;padding-top:12px}
.side h3{margin:0 0 4px;font:700 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase}
.side a{display:block;padding:13px 0;border-top:1px solid var(--rule)}
.side a .t{font:600 19px/1.3 var(--head)}
.side .none{padding:14px 0;border-top:1px solid var(--rule);font:italic 400 17px/1.45 var(--serif);color:var(--ink2)}
ol.tl{list-style:none;margin:0;padding:0}
ol.tl li{position:relative;padding:0 0 22px 28px;border-left:2px solid var(--rule);margin-left:6px}
ol.tl li::before{content:"";position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
ol.tl .when{font:700 13px/1 var(--sans);margin-bottom:6px}
ol.tl .when span{font-weight:500;color:var(--ink3)}
ol.tl a{font:500 18px/1.38 var(--serif)}
ol.tl a:hover{text-decoration:underline}
.bs-note{background:var(--amber-bg);border-top:3px solid var(--amber);padding:16px 20px;margin-top:24px;font:400 16px/1.5 var(--serif)}
.bs-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px}
.bs-tabs a,.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border:1px solid var(--rule);border-radius:999px;font:600 14px var(--sans);color:var(--ink2);background:#fff}
.bs-tabs a.on,.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.bs-tabs a b,.chip b{font-weight:500;opacity:.75}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.chip{min-height:34px;padding:0 13px;font-size:13px}
.bs-hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;margin-top:26px;padding-bottom:30px;border-bottom:1px solid var(--rule)}
.bs-hero h2{margin:8px 0 12px;font:700 32px/1.15 var(--head)}
.bs-label{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 6px;line-height:1.3 !important;font:700 11.5px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;padding:6px 9px;background:var(--amber-bg);color:var(--amber)}
.bs-label .bs-side{font-weight:700}
.bs-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:34px 28px;margin-top:8px}
.bs-card{display:block;min-width:0}
.bs-card .hl{font-size:19px;line-height:1.28;margin:10px 0 10px}
.who{font:500 12.5px/1.45 var(--sans);color:var(--ink3);margin-top:8px}
.who b{color:var(--ink2);font-weight:600}
.pub-list a{display:block;padding:11px 0;border-top:1px solid var(--rule)}
.pub-list .t{font:600 16px/1.35 var(--head)}
@media (max-width:1080px){.bs-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.bs-hero,.bs-grid{grid-template-columns:minmax(0,1fr)} .bs-hero h2{font-size:26px}}
.page-h{margin:28px 0 6px;font:700 38px/1.15 var(--head)}
.page-p{margin:0 0 20px;max-width:720px;color:var(--ink2)}
.src-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--rule);font:500 15px var(--sans)}
.src-row small{display:block;color:var(--ink3);font-size:12.5px;font-weight:400}
.count{font:500 12.5px var(--sans);color:var(--ink2);background:#f0eee9;border-radius:999px;padding:3px 10px;white-space:nowrap}
.empty{padding:60px 0;text-align:center;color:var(--ink2)}
footer{background:var(--ink);color:#d0d0d4;margin-top:56px}
footer .top{padding-top:40px;padding-bottom:32px;display:flex;flex-wrap:wrap;gap:32px 56px}
footer .logo{display:flex;align-items:center;gap:12px;font:400 30px/1 var(--brand);color:#fff}
footer .mark b{background:var(--ink)}
footer .links{display:flex;flex-direction:column;gap:10px;font:500 14px var(--sans)}
footer .links b{color:#fff}
footer .bottom{border-top:1px solid #333338;padding-top:16px;padding-bottom:24px;font:400 12.5px var(--sans);color:#9a9aa0}
footer .bottom a{color:#d0d0d4;text-decoration:underline;text-underline-offset:2px}
.lg{position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;background:#ecebe7;color:var(--ink2);font-family:var(--sans);font-weight:700;letter-spacing:0;overflow:hidden;flex:none;vertical-align:-4px;margin-right:6px;line-height:1}
.lg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.ai{border-top:3px solid var(--ink);padding-top:14px}
.ai-sum{margin:0 0 18px;font:400 20px/1.5 var(--serif)}
.ai-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.ai-side{border-left:3px solid;padding:2px 0 2px 14px}
.ai-side h3{margin:0 0 6px;font:700 12px/1.2 var(--sans);letter-spacing:.07em;text-transform:uppercase}
.ai-side p{margin:0;font:400 16.5px/1.5 var(--serif)}
.ai-diff{margin:18px 0 0;padding:12px 16px;background:var(--soft);font:400 16.5px/1.5 var(--serif)}
.ai-note{margin:12px 0 0;font:400 12.5px/1.45 var(--sans);color:var(--ink3)}
.ai-note a{text-decoration:underline}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin:22px 0}
.stats>div{background:#fff;padding:16px 18px}
.stats b{display:block;font:700 30px/1 var(--head);margin-bottom:6px}
.stats span{font:500 13px/1.35 var(--sans);color:var(--ink2)}
.box{background:var(--soft);border-top:3px solid var(--ink);padding:18px 20px;margin:0 0 20px}
.box h2{margin:0 0 8px;font:700 13px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase}
.box p{margin:0 0 8px;font:400 17px/1.5 var(--serif)}
.box .src-link{font:500 13px var(--sans);color:var(--ink2);text-decoration:underline}
.prose{max-width:720px}
.prose h2{margin:40px 0 10px;font:700 26px/1.2 var(--head)}
.prose p,.prose li{font:400 18px/1.6 var(--serif);color:var(--ink)}
.prose ol,.prose ul{padding-left:22px}
.prose li{margin-bottom:8px}
.bal-row{display:grid;grid-template-columns:180px minmax(0,1fr) 220px;gap:16px;align-items:center;padding:12px 0;border-top:1px solid var(--rule);font:500 14px var(--sans)}
.bal-row .pp{font:500 13px var(--sans);color:var(--ink2);text-align:right}
.brief-head{text-align:center;padding:36px 0 22px;border-bottom:1px solid var(--rule)}
.brief-head h1{margin:6px 0 8px;font:700 clamp(32px,5vw,48px)/1.1 var(--head)}
.brief-item{display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px 18px;padding:28px 0;border-bottom:1px solid var(--rule)}
.brief-item .no{font:700 40px/1 var(--head);color:#c9c7c1}
.brief-item h2{margin:6px 0 10px;font:700 25px/1.2 var(--head)}
.brief-end{text-align:center;padding:40px 0 8px;font:italic 400 20px/1.5 var(--serif);color:var(--ink2)}
@media (max-width:760px){.ai-two{grid-template-columns:minmax(0,1fr)} .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bal-row{grid-template-columns:minmax(0,1fr)} .bal-row .pp{text-align:left} .brief-item{grid-template-columns:minmax(0,1fr)} .brief-item .no{font-size:28px}}
@media (max-width:1080px){
  .lead{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);grid-template-rows:auto;grid-template-areas:"photo photo" "text quotes" "side more" "rail rail"}
  .rail{border-left:0;padding-left:0;border-top:3px solid var(--amber);padding-top:14px}
}
@media (max-width:900px){ .grid3{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:760px){
  .wrap{padding:0 16px} .col,.wide{padding:0 16px}
  .util .wrap{justify-content:center} .util .date{width:100%;text-align:center}
  .util input{width:150px}
  .mast{padding:18px 0 10px} .mast a{gap:12px} .mast .tag{font-size:16px}
  nav.sections{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;white-space:nowrap;gap:20px;padding:10px 16px;margin:0 -16px}
  nav.sections .sep{display:none}
  .focus{justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;white-space:nowrap}
  .lead{padding-top:0;grid-template-columns:minmax(0,1fr);grid-template-areas:"photo" "text" "quotes" "side" "more" "rail"}
  .lead-photo{margin:0 -16px} .lead-photo .meta{padding:0 16px} .lead h1{font-size:30px}
  .lead-more,.quotes2{grid-template-columns:minmax(0,1fr)}
  .grid3{grid-template-columns:1fr}
  .band .wrap{padding-top:32px;padding-bottom:36px}
  .news{padding:20px}
  .compact-head .logo{font-size:24px}
  .story .dek{font-size:18px}
}
</style>
</head>

<script>document.write('<script src="data.js?t=' + Math.floor(Date.now() / 60000) + '"><\/script>');</script>
<script>
(() => {
  "use strict";
  let D = window.NEWS_DATA;
  const app = document.getElementById("app");
  const ORDER = ["pro_government", "public", "mixed", "international", "critical"];
  const VAR = {pro_government: "var(--pg)", critical: "var(--cr)", public: "var(--pub)", mixed: "var(--mix)", international: "var(--intl)"};
  const LAB = {pro_government: "Provladini", critical: "Kritički", public: "Javni servis", mixed: "Između kategorija", international: "Međunarodni"};
  const SECTION_ORDER = ["Politika", "Društvo", "Hronika", "Ekonomija", "Svet", "Region", "Kultura"];
  const TONES = {Politika: "#7d8a96", Društvo: "#7a7166", Hronika: "#2f3846", Ekonomija: "#5f6f5c", Svet: "#5d7894", Region: "#6c6a86", Kultura: "#8a6f5c", Vesti: "#80858c"};
  const EYE = '<svg class="eye" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7c2 0 3.7.7 5.1 1.6M22 12s-3.6 7-10 7c-2 0-3.7-.7-5.1-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="m3 3 18 18"/></svg>';

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  const safe = u => /^https?:\/\//i.test(u || "") ? u : "#";
  const src = id => D.sources.find(s => s.id === id) || {name: id, camp: "mixed"};
  const camp = id => src(id).camp;
  const clock = iso => new Date(iso).toLocaleTimeString("sr-Latn-RS", {hour: "2-digit", minute: "2-digit"});
  const day = iso => new Date(iso).toLocaleDateString("sr-Latn-RS", {weekday: "long", day: "numeric", month: "long", year: "numeric"});
  const pct = (s, k) => Math.round(100 * (s.split[k] || 0) / s.sources);
  const mark = (n, gap = 3) => `<span class="mark" aria-hidden="true" style="width:${n}px;height:${n}px"><i></i><b style="width:${gap}px"></b><i></i></span>`;
  const bar = (s, h = 6) => `<div class="bar" style="height:${h}px">${ORDER.filter(k => s.split[k]).map(k =>
      `<i style="width:${100 * s.split[k] / s.sources}%;background:${VAR[k]}" title="${LAB[k]}: ${s.split[k]}"></i>`).join("")}</div>`;
  const cov = s => `<div class="cov"><span class="pg"><b>${pct(s, "pro_government")}%</b> provladini</span><span>${s.sources} medija</span><span class="cr"><b>${pct(s, "critical")}%</b> kritički</span></div>`;
  const dot = k => `<i class="dot" style="background:${VAR[k]}"></i>`;
  const kick = (t, cls = "") => `<div class="kicker ${cls}">${t}</div>`;
  const link = s => `#/vest/${s.id}`;
  const secKick = (s, extra) => kick([s.section ? esc(s.section) : "", extra].filter(Boolean).join(" · "));
  function photo(s, ratio = "3/2") {
    const tone = TONES[s.section] || TONES.Vesti;
    const img = s.image ? `<img src="${esc(safe(s.image))}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.remove('has-img');this.remove()">` : "";
    return `<div class="ph${s.image ? " has-img" : ""}" style="aspect-ratio:${ratio};background:${tone}">${img}<span>${esc(s.section || "Vesti")}</span></div>`;
  }
  // Serbian number agreement: 1 provladin, 2-4 provladina, 5+ provladinih (11-14 -> many)
  const FORMS = {pro_government: ["provladin", "provladina", "provladinih"], critical: ["kritički", "kritička", "kritičkih"],
                 public: ["javni servis", "javna servisa", "javnih servisa"], mixed: ["mešoviti", "mešovita", "mešovitih"], international: ["međunarodni", "međunarodna", "međunarodnih"], medij: ["medij", "medija", "medija"], prica: ["priča", "priče", "priča"]};
  const form = (n, k) => { const f = FORMS[k], d = n % 10, h = n % 100; return n === 1 || (d === 1 && h !== 11) ? f[0] : (d >= 2 && d <= 4 && (h < 12 || h > 14)) ? f[1] : f[2]; };
  const tidy = (t, max) => {   // calm a SHOUTED first word, optionally shorten
    t = String(t || "").replace(/^([A-ZČĆŽŠĐ]{3,})(?=[\s,])/, w => w[0] + w.slice(1).toLowerCase());
    return max && t.length > max ? t.slice(0, t.lastIndexOf(" ", max)) + "…" : t;
  };
  const firstOf = (s, k) => s.items.find(i => camp(i.source) === k);
  const bsLabel = k => k === "pro_government" ? "Prećutali provladini" : "Prećutali kritički";
  const secsWithNews = () => SECTION_ORDER.filter(n => D.stories.some(s => s.section === n));
  const host = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (_) { return ""; } };
  const initials = n => String(n).replace(/[^\p{L}\p{N} ]/gu, "").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
  // outlet logo: our own file in site/logos/<id>.png if present, otherwise the site's icon; initials underneath as fallback
  function logo(id, size = 18) {
    const s = src(id), url = s.logo || (s.home ? `https://icons.duckduckgo.com/ip3/${host(s.home)}.ico` : "");
    return `<span class="lg" style="width:${size}px;height:${size}px;font-size:${Math.max(8, Math.round(size * .4))}px" aria-hidden="true">${esc(initials(s.name))}${url ? `<img src="${esc(url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}</span>`;
  }
  const outletLink = id => `<a href="#/izvor/${encodeURIComponent(id)}" style="text-decoration:underline;text-underline-offset:2px">${esc(src(id).name)}</a>`;
  const out = (url, sid) => `href="${esc(safe(url))}" target="_blank" rel="noopener" data-s="${esc(sid)}"`;
  const topicName = slug => ((D.topics || []).find(t => t.slug === slug) || {name: slug}).name;
  const sumSplit = list => { const split = {}; list.forEach(s => Object.entries(s.split).forEach(([k, n]) => split[k] = (split[k] || 0) + n)); return {split, sources: Object.values(split).reduce((a, b) => a + b, 0)}; };
  const share = (o, k) => o.sources ? Math.round(100 * (o.split[k] || 0) / o.sources) : 0;

  // "Moja medijska ishrana": kept only in this browser (localStorage), never sent anywhere
  const DIET = "obe-strane-ishrana";
  const diet = () => { try { const d = JSON.parse(localStorage.getItem(DIET) || "{}"); return {reads: d.reads || [], views: d.views || []}; } catch (_) { return {reads: [], views: []}; } };
  const saveDiet = d => { try { const cut = Date.now() - 60 * 864e5;
    localStorage.setItem(DIET, JSON.stringify({reads: d.reads.filter(r => r.t > cut).slice(-600), views: d.views.filter(r => r.t > cut).slice(-600)})); } catch (_) {} };
  document.addEventListener("click", e => {
    const a = e.target.closest && e.target.closest("a[data-s]");
    if (!a) return;
    const d = diet(); d.reads.push({s: a.dataset.s, c: camp(a.dataset.s), t: Date.now()}); saveDiet(d);
  });
  const balanceObj = () => { const sh = (D.balance && D.balance.shown) || {}; return {split: sh, sources: Object.values(sh).reduce((a, b) => a + b, 0)}; };

  function header(active) {
    return `
    <div class="util"><div class="wrap">
      <span class="date">${esc(day(D.generated))} · ažurirano u ${clock(D.generated)}</span>
      <form id="search" role="search"><label class="vh" for="q">Pretraga</label><input id="q" type="search" placeholder="Pretraži vesti…"><button class="btn dark" type="submit">Traži</button></form>
    </div></div>
    <header class="wrap mast"><a href="#/">${mark(58, 5)}<span class="name"><i>obe strane</i></span></a>
      <div class="tag">Ista vest, dve strane. Sve što su objavili mediji u Srbiji, uporedo.</div></header>
    <div class="wrap">
      <nav class="sections" aria-label="Rubrike">
        <a href="#/" class="${active === "home" ? "on" : ""}">Naslovna</a>
        ${secsWithNews().map(n => `<a href="#/rubrika/${encodeURIComponent(n)}" class="${active === n ? "on" : ""}">${n}</a>`).join("")}
        <span class="sep" aria-hidden="true"></span>
        <a href="#/slepe-tacke" class="amber ${active === "bs" ? "on" : ""}">${EYE}Slepe tačke</a>
        <a href="#/brifing" class="${active === "brief" ? "on" : ""}">Brifing</a>
        <a href="#/izvori" class="${active === "src" ? "on" : ""}">Izvori</a>
      </nav>
      ${active === "home" || active === "topic" ? focusBar() : ""}
    </div>`;
  }
  function focusBar() {
    const t = (D.topics || []).filter(x => x.stories >= 2).sort((a, b) => b.stories - a.stories).slice(0, 8);
    if (!t.length) return `<div class="focus"><b>U fokusu</b>${D.stories.slice(0, 6).map(s => `<a href="${link(s)}">${esc(s.headline.split(/[:,–]/)[0].split(" ").slice(0, 5).join(" "))}</a>`).join("")}</div>`;
    const cur = location.hash.startsWith("#/tema/") ? decodeURIComponent(location.hash.slice(7)) : "";
    return `<div class="focus"><b>U fokusu</b>${t.map(x => `<a href="#/tema/${x.slug}" style="${x.slug === cur ? "font-weight:700;color:var(--ink)" : ""}">${esc(x.name)}</a>`).join("")}</div>`;
  }
  function compactHeader(sec) {
    return `<header class="compact-head"><div class="wrap">
      <a class="logo" href="#/">${mark(30)}<i>obe strane</i></a>
      <nav aria-label="Rubrike">${secsWithNews().slice(0, 5).map(n => `<a href="#/rubrika/${encodeURIComponent(n)}" style="${n === sec ? "border-bottom:2px solid var(--ink)" : ""}">${n}</a>`).join("")}<a href="#/slepe-tacke" style="color:var(--amber)">${EYE}Slepe tačke</a><a href="#/brifing">Brifing</a></nav>
      <a class="btn dark" href="#/">Naslovna</a></div></header>`;
  }
  const footer = () => `<footer><div class="wrap top">
      <div style="flex:1 1 260px;min-width:0"><div class="logo">${mark(32)}<i>obe strane</i></div>
      <p style="margin:14px 0 0;font:400 14px/1.55 var(--sans);color:#b8b8bd">Prikazujemo kako mediji u Srbiji izveštavaju o istim događajima. Ne pišemo vesti; povezujemo ih sa izvorima.</p></div>
      <div class="links"><b>Rubrike</b>${secsWithNews().slice(0, 5).map(n => `<a href="#/rubrika/${encodeURIComponent(n)}">${n}</a>`).join("")}</div>
      <div class="links"><b>O projektu</b><a href="#/o-nama">O nama i metodologija</a><a href="#/izvori">Izvori i vlasništvo</a><a href="#/brifing">Jutarnji brifing</a><a href="#/moja-ishrana">Moja medijska ishrana</a><a href="https://github.com/SrdjanKn/obe-strane" target="_blank" rel="noopener">Kod projekta</a></div>
    </div><div class="wrap bottom">${balanceLine()} · ${D.sources.filter(s => !s.paused).length} medija · poslednjih ${D.hours} h · ${D.articles} članaka. Oznake medija su početne procene zasnovane na javnim analizama (CRTA, BIRN, Raskrikavanje). Naslovi i linkovi pripadaju izvornim medijima.</div></footer>`;
  function balanceLine() {
    const b = balanceObj();
    if (!b.sources) return "Prototip";
    const o = 100 - share(b, "pro_government") - share(b, "critical");
    return `<a href="#/o-nama/balans">Naš balans</a>: prikazali smo ${share(b, "pro_government")}% provladinih, ${share(b, "critical")}% kritičkih i ${o}% ostalih objava`;
  }
  const newsletter = () => `<section class="news" aria-label="Bilten">
      <div style="flex:1 1 360px;min-width:0">${kick(EYE + "Jutarnji brifing · e-poštom uskoro", "amber")}
      <h2>Obe strane u 5 minuta</h2>
      <p style="margin:0;color:var(--ink2)">Najvažnije vesti dana i kako ih je koja strana uokvirila, svako jutro u 7. <a href="#/brifing" style="text-decoration:underline">Pročitajte današnji brifing</a>.</p></div>
      <form id="nl"><label>Vaša e-adresa<input type="email" required placeholder="ime@primer.rs"></label><button type="submit">Prijavi se</button></form>
    </section>`;

  const railItem = s => `<a class="rail-item" href="${link(s)}"><div class="lab ${s.blindspot === "pro_government" ? "c-pg" : "c-cr"}">${bsLabel(s.blindspot)} · ${s.sources} medija</div><div class="hl">${esc(s.headline)}</div>${bar(s, 4)}</a>`;
  const stripCard = s => `<a href="${link(s)}">${photo(s)}<div style="margin-top:12px">${secKick(s)}<div class="hl">${esc(s.headline)}</div>${bar(s)}${cov(s)}</div></a>`;
  const listItem = (s, showSec) => `<a class="li" href="${link(s)}">${showSec ? secKick(s) : ""}<div class="hl">${esc(s.headline)}</div>${bar(s, 4)}<div class="meta" style="margin-top:6px">${s.sources} medija · prvi: ${esc(src(s.broke).name)} u ${clock(s.first)}</div></a>`;
  function quotes(s) {
    const p = firstOf(s, "pro_government"), c = firstOf(s, "critical");
    const q = (i, cls) => i ? `<a class="${cls}" href="${esc(safe(i.url))}" target="_blank" rel="noopener" data-s="${esc(i.source)}"><div class="quote">„${esc(i.title)}“</div><div class="meta" style="margin-top:3px">${esc(src(i.source).name)} · ${clock(i.published)}</div></a>` : "";
    if (!p && !c) return "";
    return `<div class="meta" style="font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px">Kako su naslovili</div>
      <div class="quotes2">${q(p, "q-pg")}${q(c, "q-cr")}</div>`;
  }

  function home() {
    const S = D.stories;
    if (!S.length) return `${header("home")}<div class="wrap empty">Još nema dovoljno podataka. Sledeće prikupljanje je za najviše 15 minuta.</div>${footer()}`;
    const used = new Set();
    const take = (list, n) => list.filter(s => !used.has(s.id)).slice(0, n).map(s => (used.add(s.id), s));
    // stories with a sharp photo go first where a photo is shown big (lead, photo strip)
    const pick = (n, win) => { const pool = S.filter(s => !used.has(s.id)).slice(0, win);
      const sel = [...pool.filter(s => s.image), ...pool.filter(s => !s.image)].slice(0, n); sel.forEach(s => used.add(s.id)); return sel; };
    const [top] = pick(1, 3);
    const sideList = take(S, 2);
    const under = take(S, 2);
    const bs = S.filter(s => s.blindspot);
    const rail = [...bs.filter(s => s.blindspot === "pro_government").slice(0, 3), ...bs.filter(s => s.blindspot === "critical").slice(0, 3)].slice(0, 5);
    const strip = pick(4, 8);
    const bsDay = bs.slice().sort((a, b) => b.sources - a.sources)[0];
    const counts = SECTION_ORDER.map(n => [n, S.filter(s => s.section === n && !used.has(s.id)).length]).filter(x => x[1] >= 2).sort((a, b) => b[1] - a[1]);
    const secBlocks = counts.slice(0, 2).map(([n]) => {
      const [l, ...rest] = take(S.filter(s => s.section === n), 4);
      return `<section aria-label="${n}"><div class="sec-head"><h2>${n}</h2><a href="#/rubrika/${encodeURIComponent(n)}">Sve vesti →</a></div>
        <a class="sec-lead" href="${link(l)}"><div>${photo(l, "4/3")}</div><div>${kick(l.sources + " medija")}<div class="hl">${esc(l.headline)}</div>${bar(l)}${cov(l)}</div></a>
        ${rest.map(s => listItem(s)).join("")}</section>`;
    }).join("");
    const more = take(S, 18);
    return `${header("home")}
    <main class="wrap">
      <section class="lead" aria-label="Glavna vest">
        <div class="lead-text">
          <a href="${link(top)}">${secKick(top, top.sources + " medija")}<h1 class="hl" style="${top.headline.length > 90 ? "font-size:29px" : ""}">${esc(top.headline)}</h1>${top.summary ? `<p class="dek">${esc(tidy(top.summary, 220))}</p>` : ""}</a>
          ${bar(top, 8)}${cov(top)}
        </div>
        <div class="lead-side">${sideList.map(x => listItem(x, true)).join("")}</div>
        <div class="lead-photo"><a href="${link(top)}">${photo(top, "16/10")}</a>
          ${top.image && top.image_source ? `<div class="meta" style="margin-top:8px">Fotografija: ${esc(src(top.image_source).name)}</div>` : ""}</div>
        <div class="lead-quotes">${quotes(top)}</div>
        <div class="lead-more">${under.map(x => listItem(x, true)).join("")}</div>
        <aside class="rail" aria-label="Slepe tačke">
          <div style="display:flex;align-items:center;color:var(--amber);font:700 13px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase">${EYE}Slepe tačke</div>
          <p style="margin:8px 0 4px;font:400 14px/1.45 var(--sans);color:var(--ink2)">Vesti koje je objavila samo jedna strana.</p>
          ${rail.map(railItem).join("") || `<p class="meta">Trenutno nema slepih tačaka.</p>`}
          <a href="#/slepe-tacke" style="display:inline-block;margin-top:12px;font:600 13.5px var(--sans);color:var(--amber)">Sve slepe tačke →</a>
          ${D.briefing ? `<a href="#/brifing" class="rail-item" style="margin-top:22px;border-top:3px solid var(--ink)"><div class="lab">Jutarnji brifing</div><div class="hl">Obe strane u 5 minuta</div><div class="meta">${(D.briefing.stories || []).length} vesti · izdanje u ${clock(D.briefing.made)}</div></a>` : ""}
        </aside>
      </section>
      ${strip.length ? `<section aria-label="Najvažnije danas"><div class="sec-head"><h2>Najvažnije danas</h2><a href="#/slepe-tacke">Slepe tačke →</a></div><div class="strip">${strip.map(stripCard).join("")}</div></section>` : ""}
    </main>
    ${bsDay ? bsBand(bsDay) : ""}
    <div class="wrap">
      <div class="two">${secBlocks}</div>
      ${more.length ? `<section aria-label="Još vesti"><div class="sec-head"><h2>Još vesti</h2><span class="meta">${S.length} priča sa 2+ medija</span></div><div class="grid3">${more.map(s => listItem(s, true)).join("")}</div></section>` : ""}
      ${newsletter()}
    </div>${footer()}`;
  }
  function bsBand(s) {
    const silent = s.blindspot, loud = silent === "pro_government" ? "critical" : "pro_government";
    const n = s.split[loud] || 0;
    const items = s.items.filter(i => camp(i.source) === loud).slice(0, 5);
    const word = (k, x) => form(x, k);
    return `<section class="band" aria-label="Slepa tačka dana"><div class="wrap">
      <div style="flex:1 1 420px;min-width:0">
        <div style="display:flex;align-items:center;color:var(--amber-on-dark);font:700 13px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;margin-bottom:16px">${EYE}Slepa tačka dana</div>
        <a href="${link(s)}"><h2>${esc(s.headline)}</h2></a>
        <p>Ovu vest ${n === 1 ? "objavio je" : "objavilo je"} ${n} ${word(loud, n)} ${form(n, "medij")}. Nijedan ${silent === "critical" ? "kritički" : "provladin"} medij je nije preneo.</p>
        <div style="display:flex;gap:40px">
          <div><div class="num">${n}</div><div class="num-rule" style="background:${VAR[loud]}"></div><div class="sans" style="font-size:13px;color:#b8b8bd">${word(loud, n)}</div></div>
          <div><div class="num">0</div><div class="num-rule" style="background:${VAR[silent]}"></div><div class="sans" style="font-size:13px;color:#b8b8bd">${word(silent, 0)}</div></div>
        </div>
      </div>
      <div style="flex:1 1 380px;min-width:0">
        <div style="font:700 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:#b8b8bd;margin-bottom:6px">Ko je objavio</div>
        ${items.map(i => `<a class="item" href="${esc(safe(i.url))}" target="_blank" rel="noopener" data-s="${esc(i.source)}"><div class="src">${dot(loud)}${esc(src(i.source).name)} · ${clock(i.published)}</div><div class="t">${esc(i.title)}</div></a>`).join("")}
      </div></div></section>`;
  }

  function aiBox(s) {
    const a = s.ai;
    if (!a || !a.ukratko) return "";
    const side = (k, text) => text && s.split[k] ? `<div class="ai-side" style="border-left-color:${VAR[k]}"><h3 style="color:${VAR[k]}">Kako su uokvirili ${k === "pro_government" ? "provladini" : "kritički"}</h3><p>${esc(text)}</p></div>` : "";
    return `<section id="ukratko" class="col" style="margin-top:36px" aria-label="Ukratko"><div class="ai">
      <div class="kicker" style="color:var(--ink2)">Ukratko</div><p class="ai-sum">${esc(a.ukratko)}</p>
      ${a.provladini || a.kriticki ? `<div class="ai-two">${side("pro_government", a.provladini)}${side("critical", a.kriticki)}</div>` : ""}
      ${a.razlika ? `<p class="ai-diff"><b class="sans" style="font-size:14px">Glavna razlika:</b> ${esc(a.razlika)}</p>` : ""}
      <p class="ai-note">Ovaj sažetak je automatski napisao AI model na osnovu naslova i uvoda članaka, bez sopstvene ocene. Može da sadrži greške: proverite u izvornim člancima ispod. <a href="#/o-nama/metodologija">Kako radimo</a></p>
    </div></section>`;
  }
  function story(id) {
    const s = D.stories.find(x => x.id === id);
    if (!s) return `${compactHeader()}<div class="wrap empty">Ova vest više nije u izboru poslednjih ${D.hours} sati. <a href="#/" style="text-decoration:underline">Nazad na naslovnu</a></div>${footer()}`;
    const its = s.items.map(i => ({...i, camp: camp(i.source)}));
    const pg = its.filter(i => i.camp === "pro_government"), cr = its.filter(i => i.camp === "critical");
    const side = (list, k, title) => `<div class="side" style="border-top-color:${VAR[k]}"><h3 style="color:${VAR[k]}">${title} · ${list.length}</h3>
      ${list.length ? list.map(i => `<a href="${esc(safe(i.url))}" target="_blank" rel="noopener" data-s="${esc(i.source)}"><div class="t">${esc(i.title)}</div><div class="meta" style="margin-top:4px">${logo(i.source, 16)}${esc(src(i.source).name)} · ${clock(i.published)}</div></a>`).join("")
        : `<div class="none">Nijedan ${k === "critical" ? "kritički" : "provladin"} medij nije objavio ovu vest.</div>`}</div>`;
    const p = s.split.pro_government || 0, c = s.split.critical || 0;
    const rest = ["public", "mixed", "international"].filter(k => s.split[k]).map(k => `${s.split[k]} ${form(s.split[k], k)}`).join(" i ");
    const lead = p && c ? (Math.abs(p - c) <= 1 ? "Vest je ravnomerno pokrivena" : p > c ? "Vest više prate provladini mediji" : "Vest više prate kritički mediji") : "Vest prati samo jedna strana";
    const sentence = `${lead}: <b>${p}</b> ${form(p, "pro_government")} i <b>${c}</b> ${form(c, "critical")} ${form(c || p, "medij")}${rest ? `, uz ${rest}` : ""}.`;
    const more = D.stories.filter(x => x.section === s.section && x.id !== s.id).slice(0, 3);
    return `${compactHeader(s.section)}
    <div class="subnav"><div class="wrap"><b style="color:var(--ink)">${esc(s.section)} ›</b>
      ${s.ai ? '<button data-go="ukratko">Ukratko</button>' : ""}<button data-go="poredjenje">Kako su naslovili</button><button data-go="hronologija">Hronologija</button><button data-go="pokrivenost">Pokrivenost</button><a href="#/izvori">Izvori</a></div></div>
    <article class="story">
      <div class="col" style="padding-top:40px">
        ${kick(esc(s.section) + (s.blindspot ? " · " + EYE + "Slepa tačka" : ""), s.blindspot ? "amber" : "")}
        <h1 class="hl">${esc(s.headline)}</h1>
        ${s.summary ? `<p class="dek" style="color:var(--ink2);margin:0 0 22px">${esc(tidy(s.summary))}</p>` : ""}
        ${(s.topics || []).length ? `<div class="chips" style="margin:0 0 16px">${s.topics.map(t => `<a class="chip" href="#/tema/${t}">${esc(topicName(t))}</a>`).join("")}</div>` : ""}
        <div class="byline"><div class="meta"><b style="color:var(--ink)">Priču prati ${s.sources} medija</b> · prvi objavio ${esc(src(s.broke).name)} u ${clock(s.first)} · poslednji članak u ${clock(its[its.length - 1].published)}</div>
          <button class="pill" id="share" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg><span>Podeli</span></button></div>
      </div>
      ${s.image ? `<figure class="wide" style="margin:28px auto 0">${photo(s, "16/9")}${s.image_source ? `<figcaption class="meta" style="margin-top:8px">Fotografija: ${esc(src(s.image_source).name)}</figcaption>` : ""}</figure>` : ""}
      ${aiBox(s)}
      <section id="pokrivenost" class="col" style="margin-top:36px" aria-label="Pokrivenost"><div class="covbox">
        <div><div class="kicker" style="color:var(--ink2)">Ko je objavio</div><div class="sent">${sentence}</div>${bar(s, 14)}${cov(s)}</div>
        <div>${ORDER.map(k => `<div class="row"><span>${dot(k)}${LAB[k]}</span><b>${s.split[k] || 0}</b></div>`).join("")}</div>
      </div>
      ${s.blindspot ? `<div class="bs-note">${EYE}<b>Slepa tačka.</b> ${bsLabel(s.blindspot)} mediji nisu objavili ovu vest, iako su u to vreme objavljivali druge vesti.</div>` : ""}</section>
      <section id="poredjenje" class="wide" style="margin-top:44px" aria-label="Kako su naslovili">
        <h2 class="h2">Kako su naslovili</h2>
        <p style="margin:0 0 20px;color:var(--ink2)">Isti događaj, naslovi iz dva tabora, po vremenu objave. Naslovi vode na izvorni članak.</p>
        <div class="sides">${side(pg, "pro_government", "Provladini mediji")}${side(cr, "critical", "Kritički mediji")}</div>
      </section>
      <section id="hronologija" class="col" style="margin-top:48px" aria-label="Hronologija">
        <h2 class="h2">Hronologija</h2>
        <p style="margin:0 0 22px;color:var(--ink2)">Kako se vest širila kroz medije.</p>
        <ol class="tl">${its.map(i => `<li><div class="when">${clock(i.published)} <span>· ${logo(i.source, 15)}${outletLink(i.source)} · ${dot(i.camp)}${LAB[i.camp]}</span></div><a href="${esc(safe(i.url))}" target="_blank" rel="noopener" data-s="${esc(i.source)}">${esc(i.title)}</a></li>`).join("")}</ol>
      </section>
    </article>
    <div class="col">${newsletter()}</div>
    ${more.length ? `<div class="wrap"><div class="sec-head"><h2>Još iz rubrike ${esc(s.section)}</h2><a href="#/rubrika/${encodeURIComponent(s.section)}">Sve vesti →</a></div><div class="strip">${more.map(stripCard).join("")}</div></div>` : ""}
    ${footer()}`;
  }

  function section(name) {
    const list = D.stories.filter(s => s.section === name);
    return `${header(name)}<main class="wrap"><h1 class="page-h">${esc(name)}</h1><p class="page-p">${list.length} priča koje je objavilo najmanje dva medija u poslednjih ${D.hours} sati.</p>
      ${list.length ? `<div class="strip">${list.slice(0, 4).map(stripCard).join("")}</div><div class="grid3" style="margin-top:28px">${list.slice(4).map(s => listItem(s)).join("")}</div>` : `<div class="empty">Nema vesti u ovoj rubrici.</div>`}
    </main>${footer()}`;
  }
  function search(q) {
    const t = q.toLowerCase();
    const list = D.stories.filter(s => (s.headline + " " + s.summary + " " + s.items.map(i => i.title).join(" ")).toLowerCase().includes(t));
    return `${header()}<main class="wrap"><h1 class="page-h">„${esc(q)}“</h1><p class="page-p">${list.length} priča.</p>
      <div class="grid3">${list.map(s => listItem(s, true)).join("")}</div></main>${footer()}`;
  }
  function blindspots(filter) {
    const want = filter === "provladini" ? "pro_government" : filter === "kriticki" ? "critical" : "";
    const sec = decodeURIComponent((location.hash.split("?r=")[1] || ""));
    const all = D.stories.filter(s => s.blindspot);
    const bySide = all.filter(s => !want || s.blindspot === want);
    const list = bySide.filter(s => !sec || s.section === sec).slice().sort((a, b) => b.sources - a.sources || (b.score || 0) - (a.score || 0));
    const loudOf = s => s.blindspot === "pro_government" ? "critical" : "pro_government";
    const label = s => `<span class="bs-label">${EYE}Slepa tačka · <span class="bs-side" style="color:${VAR[s.blindspot]}">0% ${s.blindspot === "pro_government" ? "provladinih" : "kritičkih"}</span> · ${s.sources} ${form(s.sources, "medij")}</span>`;
    const who = s => {
      const names = [...new Set(s.items.filter(i => camp(i.source) === loudOf(s)).map(i => src(i.source).name))];
      return `<div class="who">Objavili: <b>${esc(names.slice(0, 3).join(", "))}</b>${names.length > 3 ? ` i još ${names.length - 3}` : ""}</div>`;
    };
    const covPct = s => `<div class="cov"><span class="pg"><b>${pct(s, "pro_government")}%</b> provladini</span><span class="cr"><b>${pct(s, "critical")}%</b> kritički</span></div>`;
    const card = s => `<a class="bs-card" href="${link(s)}">${photo(s)}<div style="margin-top:12px">${label(s)}</div><div class="hl">${esc(s.headline)}</div>${bar(s)}${covPct(s)}${who(s)}</a>`;
    const tab = (key, text, n) => `<a href="#/slepe-tacke${key ? "/" + key : ""}" class="${(filter || "") === key ? "on" : ""}">${text} <b>${n}</b></a>`;
    const secs = SECTION_ORDER.filter(n => bySide.some(s => s.section === n));
    const base = `#/slepe-tacke${filter ? "/" + filter : ""}`;
    const chips = secs.length > 1 ? `<div class="chips"><a class="chip ${!sec ? "on" : ""}" href="${base}">Sve rubrike</a>${secs.map(n => `<a class="chip ${sec === n ? "on" : ""}" href="${base}?r=${encodeURIComponent(n)}">${n} <b>${bySide.filter(s => s.section === n).length}</b></a>`).join("")}</div>` : "";
    const [hero, ...rest] = list;
    const heroHtml = hero ? `<section class="bs-hero" aria-label="Najveća slepa tačka">
        <a href="${link(hero)}">${photo(hero, "16/10")}</a>
        <div>${label(hero)}<a href="${link(hero)}"><h2 class="hl">${esc(hero.headline)}</h2></a>
          ${hero.summary ? `<p class="dek" style="font-size:16px">${esc(tidy(hero.summary, 200))}</p>` : ""}
          ${bar(hero, 8)}${covPct(hero)}
          <div class="pub-list" style="margin-top:16px"><div class="kicker" style="color:var(--ink2)">Ko je objavio</div>
          ${hero.items.filter(i => camp(i.source) === loudOf(hero)).slice(0, 4).map(i => `<a href="${esc(safe(i.url))}" target="_blank" rel="noopener" data-s="${esc(i.source)}"><div class="meta">${dot(loudOf(hero))}${esc(src(i.source).name)} · ${clock(i.published)}</div><div class="t">${esc(i.title)}</div></a>`).join("")}</div>
        </div></section>` : `<div class="empty">Trenutno nema slepih tačaka u ovom izboru.</div>`;
    // near-blindspots: 6+ outlets, the quieter side has at most 15% and is not zero
    const near = D.stories.filter(s => !s.blindspot && s.sources >= 6).map(s => {
      const p = s.split.pro_government || 0, c = s.split.critical || 0;
      const quiet = p < c ? "pro_government" : "critical", q = Math.min(p, c);
      return {s, quiet, q, share: q / s.sources};
    }).filter(x => x.q > 0 && x.share <= 0.15 && (!want || x.quiet === want) && (!sec || x.s.section === sec))
      .sort((a, b) => a.share - b.share || b.s.sources - a.s.sources).slice(0, 6);
    const nearCard = x => `<a class="bs-card" href="${link(x.s)}">${photo(x.s)}<div style="margin-top:12px"><span class="bs-label" style="background:#f3f1ec;color:var(--ink2)">Skoro slepa tačka · <span class="bs-side" style="color:${VAR[x.quiet]}">samo ${Math.round(100 * x.share)}% ${x.quiet === "pro_government" ? "provladinih" : "kritičkih"}</span></span></div><div class="hl">${esc(x.s.headline)}</div>${bar(x.s)}${covPct(x.s)}</a>`;
    return `${header("bs")}<main class="wrap">
      <h1 class="page-h" style="display:flex;align-items:center;gap:12px"><span style="color:var(--amber);display:inline-flex">${EYE.replace('class="eye"', 'style="width:36px;height:36px"')}</span>Slepe tačke</h1>
      <p class="page-p">Vesti koje je objavilo više medija jedne strane, a nijedan medij druge. Računa se samo kada su mediji te strane u to vreme bili praćeni i objavljivali druge vesti.</p>
      <nav class="bs-tabs" aria-label="Filter">${tab("", "Sve", all.length)}${tab("provladini", "Prećutali provladini", all.filter(s => s.blindspot === "pro_government").length)}${tab("kriticki", "Prećutali kritički", all.filter(s => s.blindspot === "critical").length)}</nav>
      ${chips}
      ${heroHtml}
      ${rest.length ? `<div class="sec-head"><h2>${want ? (want === "pro_government" ? "Prećutali provladini mediji" : "Prećutali kritički mediji") : "Sve slepe tačke"}</h2><span class="meta">${list.length}</span></div><div class="bs-grid">${rest.map(card).join("")}</div>` : ""}
      ${near.length ? `<div class="sec-head"><h2>Skoro slepe tačke</h2><span class="meta">jedna strana je jedva prisutna</span></div><div class="bs-grid">${near.map(nearCard).join("")}</div>` : ""}
      ${newsletter()}
    </main>${footer()}`;
  }
  function sources() {
    const row = s => `<div class="src-row"><div><a href="#/izvor/${encodeURIComponent(s.id)}" style="font-weight:600">${logo(s.id, 18)}${esc(s.name)}</a>${s.paused ? `<small>Pauzirano: ${esc(s.paused)}</small>` : s.owner ? `<small>${esc(tidy(s.owner, 120))}</small>` : s.note ? `<small>${esc(s.note)}</small>` : ""}</div><span class="count">${s.paused ? "pauzirano" : s.stories + " " + form(s.stories, "prica")}</span></div>`;
    const block = k => {
      const list = D.sources.filter(s => s.camp === k).sort((a, b) => b.stories - a.stories);
      if (!list.length) return "";
      const groups = [...new Set(D.sources.filter(s => s.camp === k).map(s => s.group || ""))];   // order as in sources.json
      const body = groups.length > 1
        ? groups.map(g => `<div class="kicker" style="margin:18px 0 2px;color:var(--ink2)">${esc(g || "Ostali")}</div>${list.filter(s => (s.group || "") === g).map(row).join("")}`).join("")
        : list.map(row).join("");
      return `<section style="flex:1 1 400px;min-width:0"><div class="sec-head" style="margin-top:20px;border-top-color:${VAR[k]}"><h2 style="color:${VAR[k]}">${LAB[k]}</h2><span class="meta">${list.length}</span></div>${body}</section>`;
    };
    return `${header("src")}<main class="wrap"><h1 class="page-h">Izvori i vlasništvo</h1>
      <p class="page-p">Pratimo ${D.sources.filter(s => !s.paused).length} medija. Kliknite na medij za njegov profil: vlasnik, izvor podatka, broj vesti i priče u kojima se pojavljuje. Oznake su početne procene zasnovane na javnim analizama medijske scene (CRTA, BIRN Media Ownership Monitor, Raskrikavanje) i podložne su proveri. Međunarodni mediji se prikazuju, ali se ne računaju ni na jednu stranu.</p>
      <div class="two">${block("pro_government")}${block("critical")}</div>
      <div class="two">${block("public")}${block("mixed")}${block("international")}</div></main>${footer()}`;
  }
  // ---------------------------------------------------------------- O nama, metodologija, balans
  function about() {
    const b = D.balance || {};
    const mk = o => ({split: o || {}, sources: Object.values(o || {}).reduce((a, x) => a + x, 0)});
    const row = (label, o) => `<div class="bal-row"><span>${label}</span><div>${bar(o, 12)}</div><span class="pp"><span class="c-pg">${share(o, "pro_government")}% provladini</span> · <span class="c-cr">${share(o, "critical")}% kritički</span></span></div>`;
    const shown = mk(b.shown), coll = mk(b.collected), outl = mk(b.outlets);
    const op = outl.split.pro_government || 0, oc = outl.split.critical || 0;
    const live = D.sources.filter(s => !s.paused).length;
    const u = (href, t) => `<a href="${href}" style="text-decoration:underline">${t}</a>`;
    return `${header("about")}<main class="wrap"><div class="prose">
      <h1 class="page-h">O nama</h1>
      <p class="dek" style="font-size:21px">Obe strane pokazuje kako mediji u Srbiji izveštavaju o istim događajima. Na jednom mestu vidite ko je vest objavio, kako ju je naslovio i šta je ko prećutao.</p>
      <p>U Srbiji ista vest često izgleda potpuno drugačije, u zavisnosti od toga koji medij čitate. Provladini i kritički mediji biraju različite teme, reči i sagovornike, a neke događaje jedna strana uopšte ne objavi. Mi ne pišemo vesti i ne govorimo vam šta da mislite. Povezujemo članke o istom događaju, pokazujemo ih uporedo i uz svaki dajemo link na izvorni tekst.</p>
      <p>Projekat je nezavisan, neprofitan i u fazi prototipa. Kod je javan na ${u("https://github.com/SrdjanKn/obe-strane\" target=\"_blank\" rel=\"noopener", "GitHubu")}, pa svako može da proveri kako radi.</p>
      <h2 id="metodologija">Kako radimo</h2>
      <ol>
        <li><b>Prikupljanje.</b> Više puta dnevno čitamo RSS izvore i naslovne strane ${live} medija i čuvamo naslov, uvod, vreme objave i link. Sport, zabavu i lifestyle preskačemo.</li>
        <li><b>Grupisanje u priče.</b> Program poredi reči u naslovima i uvodima, na ćirilici i latinici, i spaja članke o istom događaju objavljene u razmaku do 30 sati. Prikazujemo samo priče koje je objavilo najmanje dva medija. Naslov priče je onaj koji je najsličniji svim ostalima, bez obzira iz kog je tabora.</li>
        <li><b>Oznake medija.</b> Svaki medij ima početnu oznaku: provladin, kritički, javni servis, između kategorija ili međunarodni. Oznake se zasnivaju na javnim analizama (CRTA, BIRN Media Ownership Monitor, Raskrikavanje) i na podacima o vlasništvu. To su pretpostavke koje proveravamo, a ne presude. Ceo spisak je na stranici ${u("#/izvori", "Izvori")}.</li>
        <li><b>Slepe tačke.</b> Priča je slepa tačka kada ju je objavilo najmanje tri medija, od toga bar dva sa jedne strane, a nijedan sa druge. Računa se samo ako su mediji te druge strane u to vreme bili praćeni i objavljivali druge vesti, da kvar u prikupljanju ne bi izgledao kao prećutkivanje.</li>
        <li><b>Redosled vesti.</b> Priča je viša što je više medija prati i što je svežija: njena težina se prepolovi za svakih osam sati bez novog članka.</li>
        <li><b>AI sažeci.</b> Za najveće priče AI model (${esc(D.ai_model || "Claude")}) piše kratak neutralan sažetak i opis toga kako je koja strana uokvirila vest. Model dobija samo naslove i uvode članaka, uz uputstvo da ne ocenjuje ko je u pravu i da ne dodaje činjenice. Sažeci su uvek označeni i mogu da sadrže greške.</li>
        <li><b>Vlasništvo.</b> Podatke o vlasnicima uzimamo iz javnih izvora (State Media Monitor, CRTA, BIRN, istraživanja medija) i uz svaki navodimo izvor. Poslednja provera: novembar 2026.</li>
      </ol>
      <h2 id="balans">Naš balans</h2>
      <p>Proveravamo i sami sebe. Ovo su brojevi za poslednjih ${D.hours} sati i računaju se automatski pri svakom ažuriranju.</p>
    </div>
    <div style="max-width:900px">${row("Prikazano na sajtu", shown)}${row("Prikupljeni članci", coll)}${row("Mediji koje pratimo", outl)}</div>
    <div class="prose">
      <p>Pratimo ${op} ${form(op, "pro_government")} i ${oc} ${form(oc, "critical")} ${form(oc, "medij")}. Kritičkih medija je više, ali su mnogi manji i objavljuju ređe, pa je broj objava dve strane ujednačeniji od broja medija. U jednoj priči svaki medij se računa samo jednom, koliko god članaka da je objavio.</p>
      <h2>Ograničenja</h2>
      <ul><li>Program grupiše vesti po rečima, pa ponekad spoji dve različite vesti ili razdvoji istu.</li>
        <li>Neki mediji blokiraju automatsko čitanje. Te blokade ne zaobilazimo: takve medije pauziramo dok ne dobijemo RSS ili dozvolu redakcije.</li>
        <li>Manji mediji objavljuju malo vesti, pa se ređe pojavljuju u pričama.</li></ul>
      <h2>Kontakt</h2>
      <p>Primedbe na oznake, vlasništvo ili grupisanje vesti su dobrodošle. Pišite nam preko ${u("https://github.com/SrdjanKn/obe-strane/issues\" target=\"_blank\" rel=\"noopener", "GitHuba")}.</p>
    </div></main>${footer()}`;
  }

  // ---------------------------------------------------------------- jutarnji brifing
  function briefingPage() {
    const B = D.briefing;
    if (!B) return `${header("brief")}<div class="wrap empty">Prvi brifing stiže sutra u 7 ujutru.</div>${footer()}`;
    const dateStr = new Date(B.day + "T12:00:00").toLocaleDateString("sr-Latn-RS", {weekday: "long", day: "numeric", month: "long"});
    const live = id => D.stories.some(s => s.id === id);
    const q = (i, cls) => i ? `<a class="${cls}" ${out(i.url, i.source)}><div class="quote" style="font-size:16px">„${esc(i.title)}“</div><div class="meta" style="margin-top:3px">${logo(i.source, 14)}${esc(src(i.source).name)}</div></a>` : "";
    const framing = s => [["pro_government", s.ai.provladini], ["critical", s.ai.kriticki]].filter(x => x[1] && s.split[x[0]]).map(([k, t]) =>
      `<div class="ai-side" style="border-left-color:${VAR[k]}"><h3 style="color:${VAR[k]}">${k === "pro_government" ? "Provladini" : "Kritički"}</h3><p style="font-size:15.5px">${esc(t)}</p></div>`).join("");
    const item = (s, n) => `<article class="brief-item"><div class="no">${n}</div><div>
        ${kick([esc(s.section), s.sources + " " + form(s.sources, "medij"), s.blindspot ? EYE + bsLabel(s.blindspot) : ""].filter(Boolean).join(" · "), s.blindspot ? "amber" : "")}
        ${live(s.id) ? `<a href="#/vest/${s.id}"><h2 class="hl">${esc(s.headline)}</h2></a>` : `<h2 class="hl">${esc(s.headline)}</h2>`}
        ${s.ai && s.ai.ukratko ? `<p style="margin:0 0 14px">${esc(s.ai.ukratko)}</p>` : s.summary ? `<p style="margin:0 0 14px;color:var(--ink2)">${esc(tidy(s.summary, 240))}</p>` : ""}
        ${s.ai && (s.ai.provladini || s.ai.kriticki) ? `<div class="ai-two" style="margin-bottom:14px">${framing(s)}</div>` : (s.pg || s.cr) ? `<div class="quotes2">${q(s.pg, "q-pg")}${q(s.cr, "q-cr")}</div>` : ""}
        ${bar(s, 6)}${cov(s)}</div></article>`;
    const list = B.stories || [], bs = B.blindspots || [];
    const mins = Math.max(3, Math.round((list.length + bs.length) * 0.6));
    const anyAi = list.some(s => s.ai);
    return `${header("brief")}<main class="col" style="max-width:820px">
      <div class="brief-head">${kick("Jutarnji brifing · " + esc(dateStr))}<h1>Obe strane u 5 minuta</h1>
        <p class="meta" style="font-size:14px;max-width:560px;margin:0 auto">${list.length} najvažnijih vesti iz poslednja 24 sata i kako ih je koja strana prenela. Izdanje se pravi jednom dnevno, u 7 ujutru. Čitanje: oko ${mins} minuta.</p></div>
      ${list.map((s, i) => item(s, i + 1)).join("")}
      ${bs.length ? `<div class="sec-head" style="border-top-color:var(--amber)"><h2 style="color:var(--amber);display:flex;align-items:center">${EYE}Prećutano</h2><span class="meta">objavila samo jedna strana</span></div>${bs.map((s, i) => item(s, list.length + i + 1)).join("")}` : ""}
      ${anyAi ? `<p class="ai-note" style="margin-top:20px">Sažetke i opise uokviravanja napisao je AI model na osnovu naslova i uvoda članaka. Mogu da sadrže greške. <a href="#/o-nama/metodologija">Kako radimo</a></p>` : ""}
      <div class="brief-end">To je sve za danas. Sledeće izdanje je sutra u 7.<br><a href="#/" class="sans" style="font-size:15px;font-style:normal;text-decoration:underline">Vesti tokom dana su na naslovnoj</a></div>
    </main>${footer()}`;
  }

  // ---------------------------------------------------------------- profil medija
  const CAMP_WHY = {pro_government: "Prema javnim analizama medijske scene, ovaj medij uglavnom prenosi stavove vlasti i retko je kritikuje.",
    critical: "Prema javnim analizama medijske scene, ovaj medij redovno kritički izveštava o vlasti.",
    public: "Javni medijski servis, finansiran iz takse i budžeta. Ne računa se ni na jednu stranu.",
    mixed: "Ne pripada jasno nijednoj strani: uređivački je hibridan, poslovni ili specijalizovan.",
    international: "Međunarodni medij na srpskom jeziku. Prikazuje se, ali se ne računa ni na jednu stranu."};
  function outletPage(id) {
    const s = D.sources.find(x => x.id === id);
    if (!s) return `${header("src")}<div class="wrap empty">Nepoznat medij. <a href="#/izvori" style="text-decoration:underline">Svi izvori</a></div>${footer()}`;
    const mine = D.stories.filter(x => x.items.some(i => i.source === id));
    const srcLink = u => u ? `<a class="src-link" href="${esc(safe(u))}" target="_blank" rel="noopener">Izvor: ${esc(host(u))}</a>` : "";
    const date = iso => new Date(iso).toLocaleDateString("sr-Latn-RS", {day: "numeric", month: "long"});
    return `${header("src")}<main class="wide">
      <div style="padding-top:28px">${kick(`<a href="#/izvori">Izvori</a> › <span style="color:${VAR[s.camp]}">${LAB[s.camp]}</span>${s.group ? " · " + esc(s.group) : ""}`)}
        <h1 class="page-h" style="display:flex;align-items:center;gap:14px;margin-top:6px">${logo(id, 44)}${esc(s.name)}</h1>
        <a class="meta" href="${esc(safe(s.home))}" target="_blank" rel="noopener" style="text-decoration:underline">${esc(host(s.home))} ↗</a></div>
      ${s.paused ? `<div class="bs-note"><b>Pauzirano.</b> ${esc(s.paused)}</div>` : ""}
      <div class="stats"><div><b>${s.a36}</b><span>članaka u poslednjih ${D.hours} h</span></div><div><b>${s.a7}</b><span>članaka u 7 dana</span></div>
        <div><b>${s.stories}</b><span>${form(s.stories, "prica")} sa 2+ medija</span></div><div><b>${s.blind_loud}</b><span>slepih tačaka u kojima je objavio vest</span></div></div>
      <div class="two" style="gap:24px">
        <section style="flex:1 1 380px;min-width:0"><div class="box"><h2>Vlasništvo</h2>
          ${s.owner ? `<p>${esc(s.owner)}</p>${srcLink(s.owner_src)}` : `<p style="color:var(--ink2)">Podatke o vlasništvu još nismo proverili. Ako imate pouzdan izvor, <a href="https://github.com/SrdjanKn/obe-strane/issues" target="_blank" rel="noopener" style="text-decoration:underline">javite nam</a>.</p>`}
          ${s.public_money ? `<p style="margin-top:14px"><b class="sans" style="font-size:14px">Javni novac:</b> ${esc(s.public_money)}</p>${srcLink(s.public_money_src)}` : ""}
        </div></section>
        <section style="flex:1 1 380px;min-width:0"><div class="box" style="border-top-color:${VAR[s.camp]}"><h2 style="color:${VAR[s.camp]}">Oznaka: ${LAB[s.camp]}</h2>
          <p>${CAMP_WHY[s.camp] || ""} Oznaka je početna procena koju proveravamo.</p>${s.note ? `<p style="color:var(--ink2)">${esc(s.note)}</p>` : ""}
          ${s.sections.length ? `<div class="meta" style="margin-top:10px">Najčešće rubrike</div><div class="chips">${s.sections.map(n => `<a class="chip" href="#/rubrika/${encodeURIComponent(n)}">${esc(n)}</a>`).join("")}</div>` : ""}
        </div></section>
      </div>
      ${mine.length ? `<div class="sec-head"><h2>Priče u kojima se pojavljuje</h2><span class="meta">${mine.length}</span></div><div class="grid3">${mine.slice(0, 12).map(x => listItem(x, true)).join("")}</div>` : ""}
      ${s.recent.length ? `<div class="sec-head"><h2>Najnoviji članci</h2><span class="meta">poslednjih 7 dana</span></div>${s.recent.map(r => `<a class="li" ${out(r.url, id)}><div class="meta">${date(r.published)} u ${clock(r.published)}</div><div class="hl" style="margin-top:4px">${esc(r.title)}</div></a>`).join("")}` : ""}
    </main>${footer()}`;
  }

  // ---------------------------------------------------------------- teme
  function topicPage(slug) {
    const t = (D.topics || []).find(x => x.slug === slug);
    const list = D.stories.filter(s => (s.topics || []).includes(slug));
    if (!t || !list.length) return `${header("topic")}<div class="wrap empty">Trenutno nema vesti na ovu temu. <a href="#/" style="text-decoration:underline">Nazad na naslovnu</a></div>${footer()}`;
    const agg = sumSplit(list), bs = list.filter(s => s.blindspot).length;
    const p = agg.split.pro_government || 0, c = agg.split.critical || 0;
    const who = p && c ? (Math.abs(p - c) <= Math.max(1, (p + c) * .1) ? "Obe strane podjednako prate ovu temu" : p > c ? "Ovu temu više prate provladini mediji" : "Ovu temu više prate kritički mediji") : "Ovu temu prati samo jedna strana";
    const bsWord = bs === 1 ? "slepa tačka" : bs < 5 ? "slepe tačke" : "slepih tačaka";
    return `${header("topic")}<main class="wrap">
      <div style="padding-top:22px">${kick("Tema")}</div><h1 class="page-h" style="margin-top:0">${esc(t.name)}</h1>
      <p class="page-p">${list.length} ${form(list.length, "prica")} u poslednjih ${D.hours} sati. ${who}: ${p} ${form(p, "pro_government")} i ${c} ${form(c, "critical")} ${form(c || p, "medij")}${bs ? `, uz ${bs} ${bsWord}` : ""}.</p>
      <div style="max-width:720px">${bar(agg, 12)}<div class="cov"><span class="pg"><b>${share(agg, "pro_government")}%</b> provladini</span><span>${agg.sources} objava</span><span class="cr"><b>${share(agg, "critical")}%</b> kritički</span></div></div>
      <div class="strip" style="margin-top:30px">${list.slice(0, 4).map(stripCard).join("")}</div>
      ${list.length > 4 ? `<div class="grid3" style="margin-top:28px">${list.slice(4).map(s => listItem(s, true)).join("")}</div>` : ""}
    </main>${footer()}`;
  }

  // ---------------------------------------------------------------- moja medijska ishrana
  function dietPage() {
    const d = diet(), cut = Date.now() - 30 * 864e5;
    const reads = d.reads.filter(r => r.t > cut), views = d.views.filter(r => r.t > cut);
    const split = {}; reads.forEach(r => split[r.c] = (split[r.c] || 0) + 1);
    const o = {split, sources: reads.length};
    const top = Object.entries(reads.reduce((m, r) => (m[r.s] = (m[r.s] || 0) + 1, m), {})).sort((a, b) => b[1] - a[1]).slice(0, 6);
    const p = share(o, "pro_government"), c = share(o, "critical");
    const lean = Math.abs(p - c) <= 15 ? "Čitate obe strane približno podjednako." : p > c ? "Više čitate provladine medije." : "Više čitate kritičke medije.";
    const weak = p > c ? "critical" : "pro_government";
    const sugg = D.stories.filter(s => (s.split[weak] || 0) >= 1).slice(0, 6);
    const bsViews = new Set(views.filter(v => v.bs).map(v => v.id)).size;
    const n = reads.length, word = n % 10 === 1 && n % 100 !== 11 ? "otvorenog članka" : "otvorenih članaka";
    const body = !n ? `<div class="box"><h2>Još nema podataka</h2><p>Kada otvorite članke iz priča (naslove koji vode na izvorne medije), ovde ćete videti sa koje strane najviše čitate.</p><a class="btn dark" href="#/">Na naslovnu</a></div>` : `
      <div class="box"><h2>Šta čitate</h2><p style="font-size:20px">${lean} Od ${n} ${word}, ${p}% je iz provladinih, a ${c}% iz kritičkih medija.</p>${bar(o, 14)}
        <div style="margin-top:12px">${ORDER.filter(k => split[k]).map(k => `<div class="src-row"><span>${dot(k)}${LAB[k]}</span><b>${split[k]}</b></div>`).join("")}</div></div>
      <div class="two" style="gap:24px">
        <section style="flex:1 1 360px;min-width:0"><div class="box"><h2>Najčešći izvori</h2>${top.map(([sid, k]) => `<div class="src-row"><a href="#/izvor/${encodeURIComponent(sid)}">${logo(sid, 18)}${esc(src(sid).name)}</a><span class="count">${k}</span></div>`).join("")}</div></section>
        <section style="flex:1 1 360px;min-width:0"><div class="box"><h2>Slepe tačke</h2><p>Otvorili ste ${bsViews} ${bsViews === 1 ? "priču koja je slepa tačka" : "priča koje su slepe tačke"}.</p><a class="src-link" href="#/slepe-tacke">Šta je koja strana prećutala →</a></div></section>
      </div>
      ${sugg.length ? `<div class="sec-head"><h2>Proširite vidike</h2><span class="meta">kako su iste priče preneli ${weak === "critical" ? "kritički" : "provladini"} mediji</span></div><div class="grid3">${sugg.map(s => {
        const i = s.items.find(x => camp(x.source) === weak);
        return `<div class="li"><a href="${link(s)}"><div class="hl">${esc(s.headline)}</div></a>${i ? `<a ${out(i.url, i.source)} class="meta" style="display:block;margin-top:6px">${logo(i.source, 14)}${esc(src(i.source).name)}: „${esc(tidy(i.title, 90))}“ ↗</a>` : ""}</div>`;
      }).join("")}</div>` : ""}
      <p style="margin-top:28px"><button class="btn" id="diet-clear" type="button">Obriši moje podatke</button></p>`;
    return `${header("diet")}<main class="wide"><h1 class="page-h">Moja medijska ishrana</h1>
      <p class="page-p">Koje medije čitate preko Obe strane u poslednjih 30 dana. Podaci se čuvaju samo u ovom pregledaču i nigde se ne šalju.</p>${body}</main>${footer()}`;
  }

  function render(nav) {
    if (!D) { app.innerHTML = `<div class="wrap empty">Podaci se još prikupljaju.</div>`; return; }
    const [page, ...rest] = location.hash.split("?")[0].replace(/^#\/?/, "").split("/");
    const arg = decodeURIComponent(rest.join("/"));
    app.innerHTML = page === "vest" ? story(arg) : page === "rubrika" ? section(arg) : page === "slepe-tacke" ? blindspots(arg)
      : page === "izvori" ? sources() : page === "izvor" ? outletPage(arg) : page === "pretraga" ? search(arg)
      : page === "o-nama" ? about() : page === "brifing" ? briefingPage() : page === "tema" ? topicPage(arg)
      : page === "moja-ishrana" ? dietPage() : home();
    if (page === "o-nama" && arg) setTimeout(() => { const t = document.getElementById(arg); if (t) t.scrollIntoView(); }, 0);
    const f = document.getElementById("search");
    if (f) f.addEventListener("submit", e => { e.preventDefault(); const v = document.getElementById("q").value.trim(); if (v) location.hash = "#/pretraga/" + encodeURIComponent(v); });
    const nl = document.getElementById("nl");
    if (nl) nl.addEventListener("submit", e => { e.preventDefault(); nl.innerHTML = '<p class="sans" style="margin:0;font-weight:600">Hvala na interesovanju! Prijava e-poštom još nije uključena, pa adresu nismo sačuvali. Do tada je brifing svako jutro ovde.</p>'; });
    const clr = document.getElementById("diet-clear");
    if (clr) clr.addEventListener("click", () => { try { localStorage.removeItem(DIET); } catch (_) {} render(); });
    const sh = document.getElementById("share");
    if (sh) sh.addEventListener("click", async () => {
      try { if (navigator.share) await navigator.share({title: document.title, url: location.href}); else { await navigator.clipboard.writeText(location.href); sh.querySelector("span").textContent = "Link kopiran"; } } catch (_) {}
    });
    document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => { const t = document.getElementById(b.dataset.go); if (t) t.scrollIntoView({behavior: "smooth"}); }));
    const st = page === "vest" && D.stories.find(x => x.id === arg);
    if (nav && st) { const d = diet(); d.views.push({id: st.id, bs: !!st.blindspot, t: Date.now()}); saveDiet(d); }
    document.title = st ? `${st.headline} — Obe strane` : "Obe strane — ista vest, dve strane";
  }
  window.addEventListener("hashchange", () => { render(true); if (!/^#\/o-nama\/./.test(location.hash)) window.scrollTo(0, 0); });
  setInterval(() => {
    const s = document.createElement("script");
    s.src = "data.js?t=" + Date.now();
    s.onload = () => { const y = window.scrollY; D = window.NEWS_DATA; render(); window.scrollTo(0, y); s.remove(); };
    document.body.appendChild(s);
  }, 5 * 60 * 1000);
  render(true);
})();
</script>
</body>
</html>
