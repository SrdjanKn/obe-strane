<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obe strane — ista vest, dve strane</title>
<meta name="description" content="Kako mediji u Srbiji izveštavaju o istim događajima: provladini i kritički naslovi, uporedo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@1&family=Noto+Serif:wght@700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Obe strane: design "Vaga" (see DESIGN.md). Pro-government always left of the seam, critical always right; dashes mean silence. */
:root{
  --ink:#1b1d2a; --ink2:#555866; --ink3:#555866; --beton:#eceeec; --track:#dfe2df; --line:#d3d6d3;
  --pg:#a93a2b; --cr:#2445a3; --pub:#7d6aa8; --mix:#a9a69e; --intl:#3f7f86;
  --amber:#9a5b00; --amber-bg:#fff; --amber-on-dark:#e7a24c;
  --rule:var(--line); --soft:var(--beton);
  --head:"Noto Serif", Georgia, serif;
  --brand:"DM Serif Display", Georgia, serif;
  --serif:"Source Sans 3", "Source Sans Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --sans:var(--serif);
  --s1:13.6px; --s2:17px; --s3:21px; --s4:26.5px; --s5:33px; --s6:41.5px; --s7:52px;
  --w:1240px; --g:24px;
}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font:400 var(--s2)/1.55 var(--serif);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
a:hover .hl,a.hl:hover{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
:focus-visible{outline:2px solid var(--cr);outline-offset:3px;border-radius:2px}
button,input{font:inherit;color:inherit}
img{display:block;max-width:100%}
p,li,small,.dek{text-wrap:pretty}
.wrap{--pad:32px;max-width:var(--w);margin:0 auto;padding:0 var(--pad)}
.col{max-width:720px;margin:0 auto;padding:0 24px}
.wide{max-width:1080px;margin:0 auto;padding:0 24px}
.sans{font-family:var(--sans)}
.hl{font-family:var(--head);font-weight:700;letter-spacing:-.012em;color:var(--ink);text-wrap:balance}
.meta{font:400 var(--s1)/1.45 var(--sans);color:var(--ink2)}
.dim{color:var(--ink2);font-weight:400}
.kicker{display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px;font:600 var(--s1)/1.3 var(--sans);color:var(--ink);margin-bottom:8px}
.kicker.amber{color:var(--amber)}
.kicker.amber .dim{color:var(--amber)}
.sub-label{font:600 var(--s1)/1.3 var(--sans);color:var(--ink2);margin-bottom:10px}
.eye{width:14px;height:14px;vertical-align:-2px;margin-right:6px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1.5px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink);font:600 15px var(--sans);cursor:pointer}
.btn.dark{background:var(--ink);color:#fff}
.btn:hover{background:var(--beton)} .btn.dark:hover{background:#30334a}
.c-pg{color:var(--pg)} .c-cr{color:var(--cr)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}

/* the mark: two halves around a white seam */
.mark{display:inline-flex;border-radius:50%;overflow:hidden;transform:rotate(-35deg);flex:none}
.mark i{flex:1;background:var(--pg)} .mark i:last-child{background:var(--cr)} .mark b{background:#fff}

/* header */
header.top{border-bottom:1px solid var(--line)}
.top-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:16px 40px;padding-top:20px;padding-bottom:18px}
.brand{display:inline-flex;align-items:center;gap:14px;min-height:44px}
.brand .name{font:400 44px/1 var(--brand);letter-spacing:-.02em}
.today{max-width:440px;justify-self:center;width:100%}
.today-line{font:400 var(--s1)/1.3 var(--sans);color:var(--ink2);text-align:center;margin-bottom:8px;text-transform:none}
.today-line::first-letter{text-transform:uppercase}
.today-meter{display:block;padding:8px 0}
.today-cap{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font:600 var(--s1)/1.2 var(--sans);color:var(--ink2)}
.today-cap span:nth-child(2){font-weight:400}
#search{display:flex;gap:8px}
#search input{height:44px;width:210px;padding:0 12px;border:1.5px solid var(--line);border-radius:4px;background:#fff;font:400 15px var(--sans)}
#search input:focus{border-color:var(--ink);outline:none}
nav.sections{display:flex;flex-wrap:wrap;gap:2px 26px;padding:8px 0 0;font:600 16px var(--sans)}
nav.sections a{display:inline-block;padding:10px 0 11px;border-bottom:3px solid transparent;color:var(--ink)}
nav.sections a:hover{border-bottom-color:var(--line)}
nav.sections a.on{border-bottom-color:var(--ink)}
nav.sections a.amber{color:var(--amber)}
nav.sections a.amber.on{border-bottom-color:var(--amber)}
nav.sections .sep{width:1px;background:var(--line);margin:8px 0 12px}
.focus{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:12px 0 14px;font:400 15px var(--sans);color:var(--ink2);border-top:1px solid var(--line)}
.focus b{color:var(--ink);font-weight:600}
.focus a{display:inline-flex;align-items:center;min-height:44px;margin:-12px 0}
.focus a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.compact-head{border-bottom:1px solid var(--line)}
.compact-head .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;padding-top:14px;padding-bottom:12px}
.compact-head .logo{display:inline-flex;align-items:center;gap:10px;min-height:44px;font:400 32px/1 var(--brand)}
.compact-head nav{display:flex;flex-wrap:wrap;gap:0 22px;font:600 15px var(--sans)}
.compact-head nav a{display:inline-flex;align-items:center;min-height:44px;padding:3px 0 0;border-bottom:3px solid transparent}
.compact-head nav a.on{border-bottom-color:var(--ink)}
.compact-head nav a.amber{color:var(--amber)}

/* the meter: the one bold element */
.meter{position:relative;height:var(--h,6px);background:var(--track);border-radius:1px}
.meter>span{position:absolute;top:0;bottom:0}
.m-pg{background:var(--pg)} .m-cr{background:var(--cr)}
.m-n{left:50%;transform:translateX(-50%);background:var(--mix)}
.m-axis{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink)}
.meter.big .m-axis{top:-7px;bottom:-7px}
.meter.big .m-pg{transform-origin:right center;animation:grow .9s cubic-bezier(.2,.8,.2,1) .15s both}
.meter.big .m-cr{transform-origin:left center;animation:grow .9s cubic-bezier(.2,.8,.2,1) .15s both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.cov{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 12px;margin-top:8px;font:400 var(--s1)/1.3 var(--sans);color:var(--ink2)}
.cov>span:last-child{text-align:right}
.cov .pg{color:var(--pg)} .cov .cr{color:var(--cr)}
.cov b{font-weight:700}

/* photos */
.ph{position:relative;width:100%;aspect-ratio:3/2;overflow:hidden;background:#71757a;border-radius:3px}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph span{position:absolute;left:14px;bottom:12px;z-index:1;font:600 var(--s1)/1 var(--sans);color:#fff}
.ph.has-img span{display:none}

/* home: 12-column grid */
.lead{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:auto auto 1fr;column-gap:var(--g);row-gap:28px;padding-top:32px;align-items:start;
  grid-template-areas:"t t t p p p p p r r r r" "s s s q q q q q r r r r" "s s s m m m m m r r r r"}
.lead-text{grid-area:t;min-width:0}
.lead-photo{grid-area:p;min-width:0}
@media (min-width:1081px){
  .lead-photo{align-self:stretch;display:flex;flex-direction:column}
  .lead-photo>a{flex:1;display:flex;flex-direction:column}
  .lead-photo .ph{flex:1;aspect-ratio:auto!important;min-height:260px}
}
.lead-quotes{grid-area:q;min-width:0}
.lead-side{grid-area:s;min-width:0}
.lead-more{grid-area:m;min-width:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:var(--g);align-content:start}
.rail{grid-area:r;min-width:0}
.lead h1{margin:0 0 14px;font-size:var(--s6);line-height:1.08;letter-spacing:-.02em}
.dek{margin:0 0 20px;font:400 18px/1.55 var(--serif);color:var(--ink2)}
.quotes2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin-bottom:16px;position:relative}
.quotes2::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink)}
.q-pg{display:block;padding-right:22px;text-align:right}
.q-cr{display:block;padding-left:22px}
.q-pg .quote{color:var(--pg)} .q-cr .quote{color:var(--cr)}
.quote{font:700 18px/1.32 var(--head)}
.q-pg:hover .quote,.q-cr:hover .quote{text-decoration:underline;text-underline-offset:3px}

/* Slepe tačke rail: silence is drawn dashed */
.bs-panel-h{margin:0;font:inherit}
.bs-panel{border:2px dashed var(--amber);border-radius:6px;padding:18px 20px 20px;background:#fff}
.bs-panel-head{display:flex;align-items:center;color:var(--amber);font:700 var(--s3)/1.1 var(--head)}
.bs-panel-head .eye{width:18px;height:18px}
.bs-panel-dek{margin:6px 0 0;font:400 15px/1.45 var(--sans);color:var(--ink2)}
.bs-group h3{margin:18px 0 0;padding-bottom:6px;font:600 var(--s1)/1.2 var(--sans);border-bottom:1.5px solid}
.rail-item{display:block;padding:14px 0;border-top:1px solid var(--line)}
.bs-panel .rail-item{border-top:1px dashed var(--line);padding:12px 0 14px}
.bs-panel .bs-group .rail-item:first-of-type{border-top:0}
.rail-item .hl{font-size:17px;line-height:1.3;margin-bottom:10px}
.rail-item .lab{font:600 var(--s1)/1 var(--sans);margin-bottom:7px}
.sil{position:relative;display:flex;gap:6px;height:7px}
.sil span{flex:1;box-sizing:border-box;border-radius:1px}
.sil .gone{border:1.5px dashed;background:transparent}
.sil::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink)}
.sil-lab{display:flex;justify-content:space-between;margin-top:7px;font:600 var(--s1)/1 var(--sans)}
.bs-panel .all{display:inline-block;margin-top:12px;font:700 15px var(--sans);color:var(--amber);text-decoration:underline;text-underline-offset:3px}
.brief-band{background:var(--beton);margin-top:56px;padding:40px 0 44px}
.brief-band .wrap{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:0 var(--g);align-items:start}
.bb-photo{grid-column:1/6}.bb-photo .ph{border-radius:6px}
.bb-body{grid-column:6/13;max-width:640px}
.bb-title{font:700 var(--s4)/1.15 var(--head);letter-spacing:-.012em;margin:0 0 4px;color:var(--ink)}
.bb-facts{font:400 var(--s1)/1.4 var(--sans);color:var(--ink2);margin:0 0 18px;font-variant-numeric:tabular-nums}
.bb-body .hl{font-size:var(--s5);line-height:1.12;margin:0 0 12px}
.bb-body .hl a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.bb-lede{font-size:var(--s2);line-height:1.5;margin:0 0 18px}
.bb-more{font-size:15px;line-height:1.55;margin:0 0 22px;color:var(--ink2)}
.bb-more a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.bb-more a:hover{text-decoration-color:var(--ink)}
.bb-more{max-width:62ch}
.bb-nl{margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
.bb-nl label{display:flex;flex-direction:column;gap:8px;font:600 var(--s1)/1.3 var(--sans);color:var(--ink2)}
.bb-nl label>span{display:flex;flex-wrap:wrap;gap:10px}
.bb-nl input{flex:1 1 220px;max-width:340px;height:44px;padding:0 14px;border:1.5px solid var(--ink);border-radius:4px;background:#fff;font:400 16px var(--sans);color:var(--ink)}
.bb-nl .btn{min-height:44px}
.sec-one>section{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);grid-template-rows:auto auto 1fr;gap:0 var(--g)}
.sec-one .sec-head{grid-column:1/-1}
.sec-one .sec-lead{display:contents}
.sec-one .sec-lead>div:first-child{grid-column:1;grid-row:2/4}
.sec-one .sec-lead>div:last-child{grid-column:2;grid-row:2;padding-bottom:6px}
.sec-one .sec-lead .hl{font-size:var(--s4)}
.sec-one .sec-rest{grid-column:2;grid-row:3}

/* sections */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:56px 0 20px}
.sec-head h2{margin:0;font:700 var(--s4)/1.15 var(--head);letter-spacing:-.015em}
.sec-head a{font:600 15px var(--sans);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.sec-head a:hover{text-decoration-color:var(--ink)}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px var(--g)}
.strip>a{min-width:0}
.strip .hl{font-size:var(--s3);line-height:1.22;margin:0 0 12px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 var(--g)}
.two>section{min-width:0}
.sec-lead{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding-bottom:10px}
.sec-lead>div{min-width:0}
.sec-lead .hl{font-size:var(--s3);line-height:1.24;margin-bottom:12px}
.li{display:block;padding:16px 0;border-top:1px solid var(--line)}
.li .hl{font-size:18px;line-height:1.3;margin-bottom:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 var(--g)}

/* Slepa tačka dana */
.bsday{background:var(--beton);margin-top:64px;border-top:2px dashed var(--amber)}
.bd-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--g);padding-top:44px;padding-bottom:52px}
.bd-text{grid-column:1/8;min-width:0}
.bd-side-col{grid-column:8/13;min-width:0}
.bd-kick{display:flex;align-items:center;color:var(--amber);font:700 var(--s3)/1.1 var(--head);margin-bottom:16px}
.bd-kick .eye{width:20px;height:20px}
.bd-h{margin:0 0 16px;font:700 var(--s5)/1.12 var(--head);letter-spacing:-.02em;color:var(--ink);text-wrap:balance}
.bd-dek{margin:0 0 28px;font:400 18px/1.55 var(--serif);color:var(--ink2);max-width:60ch}
.bd-dek b{color:var(--ink);font-weight:600}
.bd-meter{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:28px;max-width:540px}
.bd-meter::after{content:"";position:absolute;left:50%;top:0;bottom:22px;width:2px;margin-left:-1px;background:var(--ink)}
.bd-side:first-child{text-align:right}
.bd-num{font:700 var(--s7)/1 var(--head);margin-bottom:10px}
.bd-bar{height:12px;border-radius:1px}
.bd-bar.gone{border:2px dashed;background:transparent}
.bd-lab{margin-top:8px;font:600 var(--s1) var(--sans);color:var(--ink2)}
.bd-sub{font:600 var(--s1)/1 var(--sans);color:var(--ink2);margin-bottom:10px}
.bd-ai{margin-top:32px;padding:20px 22px;background:#fff;border-radius:6px}
.bd-ai p{margin:0 0 12px;font:400 17px/1.55 var(--serif)}
.bd-ai .bd-frame{border-left:3px solid;padding-left:12px}
.bd-ai .bd-note{font:400 var(--s1) var(--sans);color:var(--ink2);margin:0}
.bd-item{display:block;padding:12px 0;border-top:1px solid var(--line)}
.bd-item .t{margin-top:5px;font:700 17px/1.32 var(--head);color:var(--ink)}

/* newsletter */
.news{margin-top:64px;background:var(--beton);border-radius:6px;padding:32px 36px;display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between}
.news h2{margin:0 0 6px;font:700 var(--s5)/1.1 var(--head)}
.news form{flex:1 1 360px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.news label{flex:1 1 220px;display:flex;flex-direction:column;gap:6px;font:600 var(--s1) var(--sans)}
.news input{height:48px;padding:0 14px;border:1.5px solid var(--ink);border-radius:4px;background:#fff;font:400 16px var(--sans)}
.news button{height:48px;padding:0 22px;background:var(--ink);color:#fff;border:0;border-radius:4px;font:600 16px var(--sans);cursor:pointer}

/* story page */
.subnav{border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:5}
.subnav .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:0 24px;padding-top:2px;padding-bottom:2px;font:400 15px var(--sans);color:var(--ink2)}
.subnav button,.subnav a{display:inline-flex;align-items:center;min-height:44px;background:none;border:0;padding:0;color:inherit;cursor:pointer;font:400 15px var(--sans)}
.subnav button:hover,.subnav a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.story h1{margin:0 0 18px;font:700 clamp(32px,4.6vw,var(--s7))/1.08 var(--head);letter-spacing:-.02em}
.story .dek{font-size:var(--s3);line-height:1.5}
.byline{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.byline .meta{font-size:15px}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:1.5px solid var(--ink);border-radius:4px;background:#fff;font:600 15px var(--sans);color:var(--ink);cursor:pointer}
.pill:hover{background:var(--beton)}
.covbox{background:var(--beton);padding:28px 30px;border-radius:6px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px}
.covbox>div{min-width:0}
.covbox .sent{font:400 18px/1.5 var(--serif);margin-bottom:22px}
.covbox .row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);font:400 15px var(--sans)}
.covbox .row:first-child{border-top:0}
.covbox .row b{font-weight:700}
.h2{margin:0 0 6px;font:700 var(--s5)/1.1 var(--head);letter-spacing:-.015em}
.sides{display:grid;grid-template-columns:minmax(0,1fr) 2px minmax(0,1fr);column-gap:32px}
.seam-line{background:var(--ink)}
.side{min-width:0}
.side h3{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 4px;padding-bottom:10px;border-bottom:3px solid currentColor;font:700 var(--s3)/1.1 var(--head)}
.side h3 .n{font:700 var(--s3)/1 var(--sans)}
.side a{display:block;padding:14px 0;border-top:1px solid var(--line)}
.side h3+a{border-top:0}
.side a .t{font:700 var(--s3)/1.25 var(--head)}
.side a:hover .t{text-decoration:underline;text-underline-offset:3px}
.side .none{margin-top:10px;padding:18px;border:2px dashed currentColor;border-radius:6px;font:400 17px/1.45 var(--serif);color:var(--ink2)}
/* timeline on the seam: time in the middle, pro-government left, critical right */
ol.tl{list-style:none;margin:0;padding:0;position:relative}
ol.tl::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink)}
ol.tl li{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 84px minmax(0,1fr);align-items:start;padding-bottom:22px}
ol.tl .when{grid-column:2;grid-row:1;justify-self:center;position:relative;z-index:1;padding:2px 8px;background:#fff;border:2px solid var(--c);border-radius:999px;font:700 var(--s1)/1.2 var(--sans)}
ol.tl li.l .tl-body{grid-column:1;grid-row:1;text-align:right;padding-right:6px}
ol.tl li.r .tl-body{grid-column:3;grid-row:1;padding-left:6px}
ol.tl li.c .tl-body{grid-column:1/-1;grid-row:2;justify-self:center;max-width:46%;text-align:center;background:#fff;position:relative;z-index:1;padding:6px 10px 0}
.tl-who{font:400 var(--s1)/1.3 var(--sans);color:var(--ink2);margin-bottom:4px}
.tl-who a{color:var(--ink);font-weight:600;text-decoration:none!important}
.tl-who .dim{margin-left:8px}

ol.tl .tl-body>a{font:400 17px/1.4 var(--serif)}
ol.tl .tl-body>a:hover{text-decoration:underline;text-underline-offset:3px}
.bs-note{background:#fff;border:2px dashed var(--amber);border-radius:6px;padding:14px 18px;margin-top:20px;font:400 16px/1.5 var(--serif)}
.bs-note b{color:var(--amber)}

/* filters */
.bs-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 6px}
.bs-tabs a,.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1.5px solid var(--line);border-radius:4px;font:600 15px var(--sans);color:var(--ink);background:#fff}
.bs-tabs a:hover,.chip:hover{border-color:var(--ink)}
.bs-tabs a.on,.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.bs-tabs a b,.chip b{font-weight:400;opacity:.8}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.chip{min-height:44px;padding:0 14px;font-size:15px}

/* Slepe tačke page */
.bs-hero{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--g);margin-top:28px;padding-bottom:8px}
.bs-hero>a{grid-column:1/8;min-width:0}
.bs-hero>div{grid-column:8/13;min-width:0}
.bs-hero h2{margin:12px 0 12px;font:700 var(--s5)/1.12 var(--head)}
.bs-label{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:0;border:0;font:600 var(--s1)/1.2 var(--sans);color:var(--amber);background:none}
.bs-label.near{border-style:solid;border-color:var(--line);color:var(--ink2)}
.bs-label .bs-side{font-weight:700}
.bs-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px var(--g);margin-top:8px}
.bs-card{display:block;min-width:0}
.bs-card .hl{font-size:var(--s3);line-height:1.22;margin:12px 0 12px}
.who{font:400 var(--s1)/1.45 var(--sans);color:var(--ink2);margin-top:8px}
.who b{color:var(--ink);font-weight:600}
.pub-list a{display:block;padding:11px 0;border-top:1px solid var(--line)}
.pub-list .t{font:700 16px/1.35 var(--head)}

/* generic pages */
.page-h{margin:36px 0 8px;font:700 var(--s6)/1.1 var(--head);letter-spacing:-.02em}
.page-p{margin:0 0 24px;max-width:68ch;color:var(--ink2);font-size:18px}
.src-group{margin-top:44px}
.src-head{display:flex;align-items:baseline;gap:14px;padding-bottom:10px;border-bottom:2px solid var(--c)}
.src-head h2{margin:0;font:700 var(--s4)/1.1 var(--head);letter-spacing:-.012em;color:var(--ct,var(--c))}
.src-head span{font:400 15px var(--sans);color:var(--ink2);font-variant-numeric:tabular-nums}
.src-sub{margin:22px 0 0;padding-bottom:6px;font:600 var(--s1)/1.3 var(--sans);color:var(--ink2)}
.src-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:4px 20px;padding:12px 0 13px;border-top:1px solid var(--line);font:400 16px var(--sans)}
.src-head + .src-row{border-top:0}
.src-row a{font-weight:600}
.src-name{display:inline-flex;align-items:center;min-height:44px;margin:-10px 0;font:600 17px/1.3 var(--sans);color:var(--ink)}
.src-row small{display:block;max-width:62ch;margin-top:3px;color:var(--ink2);font:400 15px/1.45 var(--sans);text-wrap:pretty}
.src-n{padding-top:1px;font:600 15px/1.3 var(--sans);color:var(--ink);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.src-n.zero{color:var(--ink2);font-weight:400}
.empty{padding:72px 0;text-align:center;color:var(--ink2)}
.lg{position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;background:var(--beton);color:var(--ink2);font-family:var(--sans);font-weight:700;letter-spacing:0;overflow:hidden;flex:none;vertical-align:-4px;margin-right:7px;line-height:1}
.lg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}

/* Ukratko (AI) */
.ai{background:var(--beton);border-radius:6px;padding:24px 28px 22px}
.ai .kicker{font:700 var(--s3)/1.1 var(--head);color:var(--ink)!important;margin-bottom:12px}
.ai-sum{margin:0 0 20px;font:400 20px/1.55 var(--serif)}
.ai-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;position:relative}
.ai-two::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink)}
.ai-side{padding:2px 0 2px 20px;border-left:0!important}
.ai-side:first-child{padding:2px 20px 2px 0;text-align:right}
.ai-side:only-child{grid-column:1/-1;text-align:left;padding:0}
.ai-side h3{margin:0 0 6px;font:700 15px/1.2 var(--sans)}
.ai-side p{margin:0;font:400 var(--s2)/1.5 var(--serif)}
.ai-diff{margin:20px 0 0;padding:14px 16px;background:#fff;border-radius:4px;font:400 var(--s2)/1.5 var(--serif)}
.ai-note{margin:14px 0 0;font:400 var(--s1)/1.45 var(--sans);color:var(--ink2)}
.ai-note a{text-decoration:underline}

/* outlet profile, about, diet */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin:28px 0 36px;padding:18px 0;border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
.stats>div{padding:2px 20px;border-left:1px solid var(--line)}
.stats>div:first-child{padding-left:0;border-left:0}
.stats b{display:block;font:700 var(--s6)/1 var(--head);margin-bottom:8px;font-variant-numeric:lining-nums tabular-nums}
.stats span{font:400 15px/1.35 var(--sans);color:var(--ink2)}
.box{border-top:2px solid var(--ink);padding:16px 0 0;margin:0 0 28px}
.box.key{background:var(--beton);border-top:0;border-radius:6px;padding:20px 22px}
.box h2{margin:0 0 10px;font:700 var(--s3)/1.15 var(--head)}
.box p{margin:0 0 8px;font:400 17px/1.55 var(--serif)}
.box .src-link{font:600 var(--s1) var(--sans);color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.box .src-row{border-top-color:#d3d6d3}
.prose{max-width:68ch}
.prose h2{margin:44px 0 10px;font:700 var(--s4)/1.2 var(--head)}
.prose p,.prose li{font:400 18px/1.65 var(--serif);color:var(--ink)}
.prose ol,.prose ul{padding-left:22px}
.prose li{margin-bottom:10px}
.bal-row{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--g);align-items:center;padding:16px 0;border-top:1px solid var(--line);font:600 15px var(--sans)}
.bal-row>span:first-child{grid-column:1/4}
.bal-row>div{grid-column:4/10}
.bal-row .pp{grid-column:10/13;display:flex;justify-content:space-between;gap:10px;font:600 var(--s1) var(--sans)}
.brief-head{padding:44px 0 26px;border-bottom:1px solid var(--line)}
.brief-head h1{margin:6px 0 10px;font:700 clamp(36px,5vw,var(--s7))/1.05 var(--head);letter-spacing:-.02em}
.brief-head .meta{font-size:16px!important;margin:0!important;max-width:60ch!important}
.brief-item{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px 20px;padding:30px 0;border-bottom:1px solid var(--line)}
.brief-item .no{font:700 var(--s6)/1 var(--head);color:var(--ink);font-variant-numeric:tabular-nums}
.brief-item h2{margin:6px 0 12px;font:700 var(--s4)/1.18 var(--head)}
.brief-end{padding:44px 0 8px;font:700 var(--s4)/1.3 var(--head);color:var(--ink)}
.brief-end a{font-weight:600}

/* footer */
footer{background:var(--beton);color:var(--ink);margin-top:72px}
footer .top{padding-top:44px;padding-bottom:32px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--g);row-gap:28px}
footer .top>div:first-child{grid-column:1/6}
footer .top>div:nth-child(2){grid-column:7/9}
footer .top>div:nth-child(3){grid-column:9/13}
footer .logo{display:flex;align-items:center;gap:12px;font:400 32px/1 var(--brand);color:var(--ink)}
footer .mark b{background:var(--beton)}
.foot-about{margin:14px 0 0;font:400 16px/1.55 var(--sans);color:var(--ink2);max-width:46ch}
footer .links{display:flex;flex-direction:column;gap:0;font:400 16px var(--sans)}
footer .links b{padding-bottom:6px}
footer .links a{display:flex;align-items:center;min-height:44px}
footer .links b{font-weight:700}
footer .links a:hover{text-decoration:underline;text-underline-offset:3px}
footer .bottom{position:relative;padding-top:16px;padding-bottom:26px;font:400 var(--s1)/1.5 var(--sans);color:var(--ink2)}
footer .fine{margin:0;max-width:66ch}
footer .bottom::before{content:"";position:absolute;top:0;left:var(--pad,32px);right:var(--pad,32px);border-top:1px solid var(--line)}
footer .bottom a{color:var(--ink);text-decoration:underline;text-underline-offset:2px}

/* responsive */
@media (max-width:1080px){
  .top-row{grid-template-columns:auto minmax(0,1fr)} #search{grid-column:1/-1} #search input{flex:1}
  .today{justify-self:end;max-width:380px}
  .lead{grid-template-rows:auto;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-areas:"p p p p p p p p" "t t t q q q q q" "s s s m m m m m" "r r r r r r r r"}
  .strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bs-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bd-text,.bd-side-col{grid-column:1/-1} .bd-side-col{margin-top:28px} .bd-h{font-size:var(--s5)}
  .bs-hero>a,.bs-hero>div{grid-column:1/-1} .bs-hero>div{margin-top:18px}
  .two{grid-template-columns:minmax(0,1fr)}
  .covbox{grid-template-columns:minmax(0,1fr)}
  footer .top>div{grid-column:1/-1!important}
}
@media (max-width:760px){
  .bb-photo,.bb-body{grid-column:1/-1} .bb-photo{margin-bottom:20px} .brief-band{padding:28px 0 32px;margin-top:40px}
  .wrap{--pad:16px} .col,.wide{padding:0 16px}
  .top-row{grid-template-columns:minmax(0,1fr);gap:14px;padding-top:16px}
  .brand .name{font-size:36px}
  .today{justify-self:stretch;max-width:none} .today-line{text-align:left}
  nav.sections{flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;gap:22px;margin:0 -16px;padding:4px 16px 0}
  nav.sections .sep{display:none}
  .focus{flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;margin:0 -16px;padding:0 16px}
  .subnav .wrap{flex-wrap:nowrap;overflow-x:auto;white-space:nowrap}
  .focus a{margin:0}
  nav.sections,.focus,.subnav .wrap{scrollbar-width:none;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 36px),transparent)}
  nav.sections::-webkit-scrollbar,.focus::-webkit-scrollbar,.subnav .wrap::-webkit-scrollbar{display:none}
  .lead{grid-template-columns:minmax(0,1fr);grid-template-areas:"p" "t" "q" "s" "m" "r";padding-top:16px;row-gap:22px}
  .lead-photo{margin:0 -16px} .lead-photo .ph{border-radius:0} .lead-photo .meta{padding:0 16px}
  .lead h1{font-size:30px}
  .lead-more,.strip,.grid3,.bs-grid,.sec-lead{grid-template-columns:minmax(0,1fr)}
  .sec-one>section{display:block} .sec-one .sec-lead{display:grid}
  .quotes2{grid-template-columns:minmax(0,1fr);row-gap:14px} .quotes2::before{display:none}
  .q-pg{text-align:left;padding:0 0 0 12px;border-left:3px solid var(--pg)} .q-cr{padding:0 0 0 12px;border-left:3px solid var(--cr)}
  .sec-head{margin-top:44px} .sec-head h2{font-size:var(--s4)}
  .news{padding:22px}
  .desk{display:none}
  .compact-head .logo{font-size:26px} .compact-head .btn.dark{display:none}
  .story .dek{font-size:18px}
  .sides{grid-template-columns:minmax(0,1fr);row-gap:28px} .seam-line{display:none}
  ol.tl::before{left:7px}
  ol.tl li{grid-template-columns:minmax(0,1fr);padding:0 0 20px 26px}
  ol.tl .when{grid-column:1;grid-row:1;justify-self:start;margin-left:-26px}
  ol.tl li.l .tl-body,ol.tl li.r .tl-body,ol.tl li.c .tl-body{grid-column:1;grid-row:2;text-align:left;padding:6px 0 0;max-width:none;justify-self:stretch;background:none}
  .ai{padding:20px} .ai-two{grid-template-columns:minmax(0,1fr);row-gap:16px} .ai-two::before{display:none}
  .ai-side,.ai-side:first-child{text-align:left;padding:0 0 0 12px;border-left:3px solid var(--c,var(--ink))!important}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:18px} .stats>div:nth-child(odd){padding-left:0;border-left:0}
  .bal-row>span:first-child,.bal-row>div,.bal-row .pp{grid-column:1/-1} .bal-row{row-gap:8px}
  .brief-item{grid-template-columns:minmax(0,1fr)} .brief-item .no{font-size:var(--s4)}
  .page-h{font-size:var(--s5)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
