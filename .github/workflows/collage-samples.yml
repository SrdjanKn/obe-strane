name: Render collage samples (branch only)

on:
  push:
    branches: [collage-samples]
    paths: ["collage.py", "tools/collage_samples.py", ".github/workflows/collage-samples.yml"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow "rembg[cpu]"
      - run: python tools/collage_samples.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f samples
          git commit -m "Collage samples [skip ci]" || exit 0
          git push
