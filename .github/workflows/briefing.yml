name: Send morning briefing

on:
  schedule:
    # Every 30 min from 07:00 to 09:59 UTC (08:00-10:59 Belgrade in winter, 09:00-11:59 in summer). The script sends once, when today's briefing is live.
    - cron: "0,30 7-9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send now, ignoring the time and day checks"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - name: Send briefing
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          BRIEFING_STATUS: ${{ vars.BRIEFING_STATUS || 'draft' }}
        run: python3 send_briefing.py ${{ inputs.force && '--force' || '' }}
