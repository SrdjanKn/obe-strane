name: Compare story grouping (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore article database (read-only copy)
        uses: actions/cache/restore@v4
        with:
          path: news.db
          key: newsdb-none
          restore-keys: newsdb-
      - name: Restore embedding model
        uses: actions/cache@v4
        with:
          path: .fastembed
          key: fastembed-paraphrase-multilingual-MiniLM-L12-v2
      - run: |
          pip install --quiet fastembed
          python3 collector.py evalclust
